<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>תנועת האתר לפי נכס דיגיטלי — ויטוריו דיוואני</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=swap">
<style>
/* המותג של OWL. הערכים מועתקים מ-index.html כלשונם — לוח שמנסח לעצמו
   פלטה משלו נפרד מהמערכת בעדכון הראשון. */
:root{
  --font: system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew",Arial,sans-serif;
  --bg:#ffffff; --surface:#f4f8f6; --line:#e2e9e5; --line2:#cdd8d2;
  --tx:#18241f; --tx2:#53635c; --tx3:#8a978f;
  --brand:#0d9668; --brandSoft:rgba(13,150,104,.10);
  --warn-bg:#fbf0da; --warn-line:#e6c98a; --warn-tx:#8f5f08;
  --sys:#4a3aa7; --sysSoft:rgba(74,58,167,.07); --sysLine:rgba(74,58,167,.22);
  --shadow:0 1px 2px rgba(16,24,32,.05),0 6px 18px rgba(16,24,32,.05);
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1512; --surface:#19211d; --line:#26302b; --line2:#35423b;
    --tx:#e9efeb; --tx2:#a2b0a9; --tx3:#6f7d76;
    --brand:#2fbf8f; --brandSoft:rgba(47,191,143,.16);
    --warn-bg:#2e241065; --warn-line:#7c4a1a; --warn-tx:#e0b25a;
    --sys:#9085e9; --sysSoft:rgba(144,133,233,.10); --sysLine:rgba(144,133,233,.26);
    --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.35);
  }
}
/* ---------- OWL: תפריט המערכת ---------- */
.owlbar{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.owlham{flex:none;width:44px;height:44px;display:grid;place-items:center;
  border:1px solid var(--line2);background:var(--surface);color:var(--tx);
  border-radius:12px;cursor:pointer}
.owlham svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round}
.owlham:hover{border-color:var(--brand)}
.owlham:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.owlnow{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.owlnow .k{font-size:10.5px;color:var(--tx3);display:flex;align-items:center;gap:5px}
.owlnow .k i{width:6px;height:6px;border-radius:50%;background:var(--brand);display:inline-block}
.owlnow .v{font-size:18px;font-weight:700;color:var(--tx);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.owlov{position:fixed;inset:0;z-index:120;background:rgba(10,14,17,.5);display:none}
.owlov.on{display:block}
.owlsheet{position:absolute;inset-inline-start:0;top:0;bottom:0;width:min(340px,88vw);
  background:var(--surface);border-inline-end:1px solid var(--line);
  box-shadow:var(--shadow);overflow-y:auto;padding:14px 14px 30px;
  display:flex;flex-direction:column;gap:4px}
.owlhead{display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin:0 0 8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.owlhead b{font-size:16px}
.owlx{width:38px;height:38px;display:grid;place-items:center;border:0;background:none;
  color:var(--tx2);border-radius:10px;cursor:pointer}
.owlx svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.owlx:hover{background:var(--bg);color:var(--tx)}
.owlx:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.owlg{font-size:10.5px;font-weight:700;letter-spacing:.09em;color:var(--tx3);
  margin:12px 0 4px;padding-inline-start:4px}
.owlsheet a,.owlcur{display:flex;align-items:center;gap:9px;min-height:44px;
  padding:9px 11px;border-radius:11px;font-size:14.5px;color:var(--tx);
  text-decoration:none;border:1px solid transparent}
.owlsheet a:hover{background:var(--bg);border-color:var(--line)}
.owlsheet a:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.owlcur{background:#111;color:#fff;font-weight:700;cursor:default;border-color:#111}
@media (prefers-color-scheme:dark){
  .owlcur{background:#e9efeb;color:#0f1512;border-color:#e9efeb}
}
/* אותו עיצוב כמו בתפריט של הלוח הראשי: קו הפרדה, שם המערכת, כפתור שחור. */
.owlsys{margin-top:8px;padding-top:10px;border-top:1px solid var(--line)}
.owlsys .st{font-size:11px;font-weight:700;color:var(--tx3);letter-spacing:.09em;padding:2px 4px 6px}
/* ---------- זהות: לוגו דיוואני, וסימן OWL לצידו ---------- */
.hdr{display:flex;align-items:flex-start;justify-content:space-between;margin:0 0 6px}

  /* נעילת הלוגו של המערכת. הכיתוב משמאל לסמל, שניהם על הקו העליון של
     לוגו דיוואני. Space Mono הוא הפונט שנבחר ללוגו בלבד; אם הוא לא נטען,
     הנפילה היא למונוספייס של המערכת ולא לגופן הממשק. */
  .owlbrand{display:flex;align-items:flex-start;gap:7px;flex:none}
  .owllogo{width:30px;height:auto;flex:none;color:#111}
  .owleye{fill:#4a3aa7}
  .owlword{font-family:"Space Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-weight:700;font-size:17px;letter-spacing:.04em;color:#111;line-height:1;
    margin-top:2px;direction:ltr;unicode-bidi:isolate}
  @media (prefers-color-scheme:dark){
    .owllogo,.owlword{color:#e9efeb}
    .owleye{fill:#9085e9}
  }
  .brandcol{display:flex;flex-direction:column;align-items:flex-end;gap:2px;line-height:1}
.hdr .out{font-size:11.5px;color:var(--tx3);text-decoration:none;padding:6px 2px}
.hdr .logo{flex:none;line-height:0;opacity:.5}
.hdr .logo img{height:28px;width:auto;display:block}
@media (prefers-color-scheme:dark){.hdr .logo img{filter:invert(1)}}
/*OWNER*/
/* Marks a block that only the owner receives. Without the badge he has no way
   to tell whether what is on his screen is also on the team's - that not
   knowing is what sent the same question back three times. */
.owneronly{position:relative;margin-top:14px}
.owneronly::before{content:'רק אתה רואה';position:absolute;top:-10px;inset-inline-start:12px;
  white-space:nowrap;font-size:9.5px;font-weight:700;letter-spacing:.04em;color:var(--sys);
  background:var(--bg);border:1px solid var(--sysLine);border-radius:999px;padding:1px 8px;
  line-height:1.5}
/* The button has no room above it, so it carries the mark in its own colour
   and wording instead of a floating badge that would sit on top of its label. */
#infoBtn{color:var(--sys);border-color:var(--sysLine);background:var(--sysSoft);font-weight:700}
/*ENDOWNER*/
/*OWNER*/
/* ---------- view-as: the owner checking what the team sees ---------- */
.vaeye{width:40px;height:40px;flex:none;display:grid;place-items:center;cursor:pointer;
  border:1px solid var(--line2);background:var(--surface);color:var(--tx2);border-radius:11px}
.vaeye svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.vaeye:hover{border-color:#a3271f;color:#a3271f}
.vaeye:focus-visible{outline:2px solid #a3271f;outline-offset:2px}
/* אותו אדום כמו כפתור בחירת התצוגה בלוח הראשי (--dfg) */
.vaeye.on{background:#a3271f;border-color:#a3271f;color:#fff}
@media (prefers-color-scheme:dark){.vaeye.on{background:#f0968f;border-color:#f0968f;color:#2e1614}}
.vaovl{position:fixed;inset:0;z-index:140;background:rgba(10,14,17,.5);display:none}
.vaovl.on{display:block}
.vasheet{position:absolute;inset-inline:0;bottom:0;background:var(--bg);
  border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:0;
  box-shadow:var(--shadow);padding:14px 14px 26px}
@media (min-width:640px){.vasheet{inset-inline:auto;left:50%;transform:translateX(-50%);
  width:420px;bottom:auto;top:14vh;border-radius:18px;border-bottom:1px solid var(--line)}}
.vahd{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:0 0 10px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.vahd b{font-size:16px}
.varow{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;
  padding:11px 13px;margin:0 0 8px;border:1px solid var(--line);border-radius:12px;
  background:var(--surface);color:var(--tx);font:inherit;font-size:15px;cursor:pointer;text-align:start}
.varow:hover{border-color:var(--sys)}
.varow .chk{width:18px;height:18px;flex:none;opacity:0;color:var(--sys)}
.varow.on{border-color:var(--sys);background:var(--sysSoft);font-weight:700}
.varow.on .chk{opacity:1}
.varow .sub{display:block;font-size:11.5px;font-weight:400;color:var(--tx3);margin-top:1px}
/* בתצוגה מקדימה מוסתר מה שהתפקיד שנבחר אינו מקבל */
body.as-user #notice,body.as-user #infoBtn,
body.as-ido  #notice,body.as-ido  #infoBtn{display:none !important}
body.as-ido .vahide{display:none !important}
/*ENDOWNER*/
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); background:var(--bg); color:var(--tx);
  font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
  padding:0 0 40px;
}
h1,h2,h3{font-family:var(--font); margin:0; font-weight:700; line-height:1.25}
h1{font-size:25px;letter-spacing:-.01em}
h2{font-size:18px}
h3{font-size:14px}
.wrap{max-width:900px;margin:0 auto;padding:12px 12px 0}
.num{font-variant-numeric:tabular-nums;unicode-bidi:isolate}
.neg{color:#c2410c}
@media (prefers-color-scheme:dark){.neg{color:#fb923c}}
.pos{color:#0f766e}
@media (prefers-color-scheme:dark){.pos{color:#2dd4bf}}

/* ---- header ---- */
.hd{display:flex;align-items:flex-start;gap:10px;padding:6px 0 12px}
.hd .t{flex:1;min-width:0}
.hd .sub{font-size:12.5px;color:var(--tx2);margin-top:3px}
.btn{font-family:var(--font);font-size:13px;font-weight:600;border:1px solid var(--line2);
     background:var(--surface);color:var(--tx);border-radius:10px;padding:9px 14px;cursor:pointer;
     min-height:44px}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}

/* ---- visible disclaimer (not a footnote — required) ---- */
.notice{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-tx);
        border-radius:var(--r);padding:11px 13px;font-size:13px;margin:0 0 12px}
.notice b{font-weight:700}
.notice .lnk{background:none;border:none;color:inherit;text-decoration:underline;
             font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;padding:0;
             min-height:44px;display:inline-flex;align-items:center}

/* ---- cards ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
      padding:12px;margin:0 0 12px;box-shadow:var(--shadow)}
.card > h2{margin-bottom:8px}
.eyebrow{font-size:11.5px;font-weight:700;color:var(--tx3);letter-spacing:.03em;margin-bottom:4px}

/* ---- controls ---- */
.ctlrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:9px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:11px;overflow:hidden;background:var(--surface)}
.seg button{font-family:var(--font);font-size:13px;font-weight:600;border:none;background:transparent;
            color:var(--tx2);padding:9px 14px;cursor:pointer;min-height:44px;white-space:nowrap}
.seg button+button{border-right:1px solid var(--line2)}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.dates{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:3px;flex:1 1 130px;min-width:130px}
.fld span{font-size:11.5px;font-weight:700;color:var(--tx3)}
.fld input{font-family:var(--font);font-size:14px;padding:8px 10px;min-height:44px;
           border:1px solid var(--line2);border-radius:10px;background:var(--surface);color:var(--tx)}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{font-family:var(--font);font-size:12.5px;font-weight:600;border:1px solid var(--line2);
              background:var(--surface);color:var(--tx2);border-radius:999px;padding:7px 13px;cursor:pointer;min-height:44px}
.rangenote{font-size:12px;color:var(--tx3);margin-top:6px}

/* ---- platform chips ---- */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--font);font-size:12.5px;
      font-weight:600;border:1px solid var(--line2);background:var(--surface);color:var(--tx3);
      border-radius:999px;padding:7px 13px;cursor:pointer;min-height:44px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none;opacity:.35}
.chip[aria-pressed="true"]{color:var(--tx);border-color:currentColor}
.chip[aria-pressed="true"] .dot{opacity:1}
.chipreset{display:flex;justify-content:flex-start;margin:10px 0 0}
.chipreset button{font:inherit;font-size:12.5px;font-weight:600;min-height:40px;
  padding:8px 14px;border:1px solid var(--line2);border-radius:999px;
  background:var(--surface);color:var(--tx2);cursor:pointer}
.chipreset button:hover{border-color:var(--tx3);color:var(--tx)}
.chipreset button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.chipreset button:disabled{opacity:.45;cursor:default}
.chipsep{width:100%;height:1px;background:var(--line);margin:4px 0 2px}
.chiptag{font-size:10.5px;font-weight:700;color:var(--tx3);opacity:.85}

/* ---- chart ---- */
.chartbox{width:100%;overflow:hidden}
svg#chart{display:block;width:100%;touch-action:pan-y}
.legendline{font-size:12px;color:var(--tx3);margin-top:7px}
.hint{font-size:12px;color:var(--tx3);margin:6px 0 0}

/* ---- tables ---- */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
th,td{padding:8px 7px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;font-weight:700;color:var(--tx3);position:sticky;top:0;background:var(--surface)}
tbody tr:last-child td{border-bottom:none}
tr.total td{font-weight:700;border-top:2px solid var(--line2);background:rgba(127,127,127,.06)}
td.name{white-space:normal;min-width:104px}
.swatch{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:6px;vertical-align:middle}
.na{color:var(--tx3);font-size:11.5px}

/* ---- panel + modal, each with a close button ---- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
       padding:12px;margin:0 0 12px;box-shadow:var(--shadow)}
.panelhd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.x{width:44px;height:44px;min-width:44px;border:1px solid var(--line2);background:var(--surface);
   color:var(--tx2);border-radius:11px;font-size:18px;line-height:1;cursor:pointer;
   display:grid;place-items:center;font-family:var(--font)}
.x:hover{color:var(--tx)}
.scrim{position:fixed;inset:0;background:rgba(8,12,16,.5);z-index:80;display:grid;
       place-items:end center;padding:0}
.scrim[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;
       border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));
       box-shadow:0 -8px 40px rgba(0,0,0,.28)}
@media(min-width:700px){.scrim{place-items:center}.sheet{border-radius:18px}}
.sheethd{display:flex;align-items:center;justify-content:space-between;gap:8px;
         position:sticky;top:0;background:var(--surface);padding-bottom:8px;margin-bottom:4px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--tx2);display:flex;align-items:center;gap:6px}
.kv .v{font-weight:700;font-variant-numeric:tabular-nums;unicode-bidi:isolate}
.blk{margin:12px 0 0}
.blk h3{margin-bottom:5px}
.blk ul{margin:0;padding-inline-start:18px;font-size:13px;color:var(--tx2)}
.blk li{margin-bottom:5px}
.foot{font-size:11.5px;color:var(--tx3);text-align:center;padding:6px 12px 0;line-height:1.6}
</style>
</head>

const platMeta = {};

/* ---------- data access: every number comes straight out of traffic_data.json ---------- */
function periodsAll(){ return DATA.periods[state.ptype]; }
function rowsFor(plat){ return DATA.series[state.ptype][state.paid][plat]; }
function inRange(p){ return p.period_start >= state.from && p.period_end <= state.to; }
function idxInRange(){
  const out = [];
  periodsAll().forEach((p,i) => { if (inRange(p)) out.push(i); });
  return out;
}
function selectedPlats(){
  return DATA.platforms.filter(p => state.on.has(p.name)).map(p => p.name);
}
function val(plat,i){
  const r = rowsFor(plat)[i];
  if (!r) return 0;
  return state.measure === 'sessions' ? r.s : r.sh;
}
function sumSessions(plat, idx){
  const rows = rowsFor(plat);
  let t = 0;
  for (const i of idx) t += rows[i].s;
  return t;
}

/* ---------- chart (hand-drawn SVG, no libraries) ---------- */
const SVGNS = 'http://www.w3.org/2000/svg';
function el(tag,attrs,txt){
  const e = document.createElementNS(SVGNS,tag);
  for (const k in attrs) e.setAttribute(k,attrs[k]);
  if (txt != null) e.textContent = txt;
  return e;
}
let CHART = { idx:[], xs:[], plats:[] };

function drawChart(){
  const svg = $('chart');
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  const box = svg.parentNode;
  const W = Math.max(280, box.clientWidth || 320);
  const H = W < 460 ? 260 : 300;
  svg.setAttribute('width',W); svg.setAttribute('height',H);
  svg.setAttribute('viewBox','0 0 ' + W + ' ' + H);

  const idx = idxInRange();
  const plats = selectedPlats();
  CHART = { idx: idx, xs: [], plats: plats };
  const cs = getComputedStyle(document.body);
  const cLine = cs.getPropertyValue('--line').trim() || '#e3e6e9';
  const cTx3  = cs.getPropertyValue('--tx3').trim() || '#79838d';

  if (!idx.length || !plats.length){
    svg.appendChild(el('text',{x:W/2,y:H/2,'text-anchor':'middle','font-size':13,fill:cTx3,
      'font-family':cs.fontFamily}, !idx.length ? 'אין תקופה שנכללת במלואה בטווח שנבחר' : 'לא נבחר אף נכס'));
    return;
  }

  const padT = 14, padB = 40, padR = state.measure === 'sessions' ? 56 : 46, padL = 12;
  const plotW = W - padR - padL, plotH = H - padT - padB;

  let yMax = 0;
  plats.forEach(p => idx.forEach(i => { const v = val(p,i); if (v > yMax) yMax = v; }));
  if (yMax <= 0) yMax = 1;
  // round the axis up to a friendly step
  const raw = yMax / 4;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = Math.ceil(raw / mag) * mag;
  const top = step * 4;

  const n = idx.length;
  const xOf = k => (n === 1) ? (padL + plotW/2) : (W - padR - k * (plotW / (n - 1)));
  const yOf = v => padT + (1 - v / top) * plotH;
  CHART.xs = idx.map((_,k) => xOf(k));

  // partial-period bands (weeks 01/35, August) — marked, never smoothed
  const per = periodsAll();
  idx.forEach((i,k) => {
    if (!per[i].is_partial) return;
    const half = (n === 1) ? plotW/2 : (plotW / (n - 1)) / 2;
    const x0 = Math.max(padL, xOf(k) - half), x1 = Math.min(W - padR, xOf(k) + half);
    svg.appendChild(el('rect',{x:x0,y:padT,width:Math.max(2,x1-x0),height:plotH,
      fill:cTx3,opacity:.10}));
  });

  // grid + y labels (on the right — RTL)
  for (let g = 0; g <= 4; g++){
    const v = top * g / 4, y = yOf(v);
    svg.appendChild(el('line',{x1:padL,y1:y,x2:W-padR,y2:y,stroke:cLine,'stroke-width':1}));
    svg.appendChild(el('text',{x:W-padR+6,y:y+4,'font-size':10.5,fill:cTx3,
      'font-family':cs.fontFamily,direction:'ltr','text-anchor':'start'},
      state.measure === 'sessions' ? shortNum(v) : NF.format(Math.round(v)) + '%'));
  }

  // x labels — thin them out so they never collide
  const everyK = Math.max(1, Math.ceil(n / (W < 400 ? 5 : 8)));
  idx.forEach((i,k) => {
    if (k % everyK !== 0 && k !== n - 1) return;
    const p = per[i];
    const lbl = (state.ptype === 'חודש' ? p.period_label.replace(' 2026','') : p.period_label)
                + (p.is_partial ? '*' : '');
    svg.appendChild(el('text',{x:xOf(k),y:H-padB+16,'font-size':10,fill:cTx3,
      'font-family':cs.fontFamily,'text-anchor':'middle'}, lbl));
  });

  // series
  plats.forEach(p => {
    const col = platMeta[p].color;
    let d = '';
    idx.forEach((i,k) => { d += (k ? ' L ' : 'M ') + xOf(k).toFixed(1) + ' ' + yOf(val(p,i)).toFixed(1); });
    // סדרה מצורפת מסומנת גם בקו מקווקו ולא רק בגוון: היא נגזרת משתי
    // סדרות אחרות, ושתי צורות עדיפות על גוון אחד כשיש עשרה קווים במסך.
    const attrs = {d:d,fill:'none',stroke:col,'stroke-width':2.2,
      'stroke-linejoin':'round','stroke-linecap':'round'};
    if (platMeta[p].kind === 'צירוף') attrs['stroke-dasharray'] = '7 4';
    svg.appendChild(el('path',attrs));
    if (n <= 16){
      idx.forEach((i,k) => {
        svg.appendChild(el('circle',{cx:xOf(k),cy:yOf(val(p,i)),r:per[i].is_partial?2.6:3.2,
          fill:per[i].is_partial?'var(--surface)':col,stroke:col,'stroke-width':1.6}));
      });
    }
  });

  svg.appendChild(el('line',{x1:padL,y1:H-padB,x2:W-padR,y2:H-padB,stroke:cLine,'stroke-width':1.4}));
}
function shortNum(v){
  if (v >= 1000000) return NF2.format(v/1000000) + 'M';
  if (v >= 1000) return NF.format(Math.round(v/1000)) + 'K';
  return NF.format(Math.round(v));
}

/* tap on the chart opens the period detail */
$('chart').addEventListener('click', function(ev){
  if (!CHART.xs.length) return;
  const r = this.getBoundingClientRect();
  const x = ev.clientX - r.left;
  let best = 0, bd = Infinity;
  CHART.xs.forEach((cx,k) => { const d = Math.abs(cx - x); if (d < bd){ bd = d; best = k; } });
  openPeriod(CHART.idx[best]);
});

/* ---------- summary table ---------- */
function buildSummary(){
  const idx = idxInRange();
  const per = periodsAll();
  const t = $('tblSum');
  if (!idx.length){ t.innerHTML = '<tbody><tr><td class="na">אין תקופה שנכללת במלואה בטווח שנבחר.</td></tr></tbody>'; return; }
  const first = idx[0], last = idx[idx.length - 1];
  const sameLen = per[first].period_days === per[last].period_days;
  const siteSum = sumSessions('כל האתר', idx);

  let h = '<thead><tr>'
    + '<th>נכס דיגיטלי</th><th>סשנים</th><th>נתח מהאתר %</th>'
    + '<th>' + esc(per[first].period_label) + '</th>'
    + '<th>' + esc(per[last].period_label) + '</th>'
    + '<th>שינוי בכמות</th><th>שינוי ב־%</th><th>שינוי בנתח</th>'
    + '</tr></thead><tbody>';

  selectedPlats().forEach(p => {
    const rows = rowsFor(p);
    const sum = sumSessions(p, idx);
    const share = siteSum > 0 ? (sum / siteSum * 100) : 0;
    const a = rows[first], b = rows[last];
    const dq = b.s - a.s;
    const dpp = b.sh - a.sh;
    // an "%" is shown only when the file says the denominator is valid AND the two periods are the same length
    const okPct = a.dv && sameLen && a.s > 0;
    const pctCell = okPct
      ? num(pcts((b.s - a.s) / a.s * 100), clsOf(dq))
      : '<span class="na" title="' + (sameLen ? 'מכנה קטן מ־100 סשנים' : 'התקופות אינן באותו אורך') + '">'
        + (sameLen ? 'מכנה קטן מדי' : 'אורך שונה') + '</span>';
    h += '<tr>'
      + '<td class="name"><span class="swatch" style="background:' + platMeta[p].color + '"></span>' + esc(p)
      + (platMeta[p].tag ? ' <span class="chiptag">' + esc(platMeta[p].tag) + '</span>' : '') + '</td>'
      + '<td>' + num(n0(sum)) + '</td>'
      + '<td>' + num(pct(share)) + '</td>'
      + '<td>' + num(n0(a.s)) + (per[first].is_partial ? '*' : '') + '</td>'
      + '<td>' + num(n0(b.s)) + (per[last].is_partial ? '*' : '') + '</td>'
      + '<td>' + num(n0s(dq), clsOf(dq)) + '</td>'
      + '<td>' + pctCell + '</td>'
      + '<td>' + num(pps(dpp), clsOf(dpp)) + '</td>'
      + '</tr>';
  });

  const aS = rowsFor('כל האתר')[first], bS = rowsFor('כל האתר')[last];
  const dS = bS.s - aS.s;
  const okS = aS.dv && sameLen && aS.s > 0;
  h += '<tr class="total"><td class="name">כל האתר</td>'
    + '<td>' + num(n0(siteSum)) + '</td><td>' + num(pct(100)) + '</td>'
    + '<td>' + num(n0(aS.s)) + (per[first].is_partial ? '*' : '') + '</td>'
    + '<td>' + num(n0(bS.s)) + (per[last].is_partial ? '*' : '') + '</td>'
    + '<td>' + num(n0s(dS), clsOf(dS)) + '</td>'
    + '<td>' + (okS ? num(pcts((bS.s - aS.s) / aS.s * 100), clsOf(dS)) : '<span class="na">אורך שונה</span>') + '</td>'
    + '<td class="na">—</td></tr>';
  h += '</tbody>';
  t.innerHTML = h;

  const partialTxt = (per[first].is_partial || per[last].is_partial)
    ? ' · * תקופה חלקית — מוצגת כמו שהיא ומוצאת מכל חישוב מגמה' : '';
  $('tblNote').textContent =
    'שינוי בכמות = סשנים. שינוי בנתח = נקודות אחוז. שני מדדים נפרדים, לא אותו דבר.'
    + (sameLen ? '' : ' אחוז השינוי חסום כי תקופת הפתיחה והסגירה אינן באותו אורך.')
    + partialTxt;
}

/* ---------- period table ---------- */
function buildPeriodTable(){
  const idx = idxInRange(), per = periodsAll(), plats = selectedPlats();
  const t = $('tblPer');
  if (!idx.length || !plats.length){ t.innerHTML = '<tbody><tr><td class="na">אין מה להציג.</td></tr></tbody>'; return; }
  let h = '<thead><tr><th>תקופה</th><th>ימים</th>';
  plats.forEach(p => { h += '<th><span class="swatch" style="background:' + platMeta[p].color + '"></span>' + esc(p) + '</th>'; });
  h += '<th>כל האתר</th></tr></thead><tbody>';
  idx.forEach(i => {
    const p = per[i];
    h += '<tr><td class="name">' + esc(p.period_label) + (p.is_partial ? '*' : '') + '</td>'
       + '<td>' + num(n0(p.period_days)) + '</td>';
    plats.forEach(pl => {
      const r = rowsFor(pl)[i];
      h += '<td>' + num(n0(r.s)) + ' <span class="na">' + num(pct(r.sh)) + '</span></td>';
    });
    h += '<td>' + num(n0(rowsFor('כל האתר')[i].s)) + '</td></tr>';
  });
  h += '</tbody>';
  t.innerHTML = h;
  $('perTitle').textContent = 'טבלת תקופות — ' + (state.ptype === 'חודש' ? 'חודשי' : 'שבועי')
    + ' · ' + DATA.paid_label[state.paid];
}

/* ---------- modal ---------- */
function openSheet(title, body){
  $('sheetTitle').textContent = title;
  $('sheetBody').innerHTML = body;
  $('scrim').hidden = false;
  document.body.style.overflow = 'hidden';
}
function closeSheet(){ $('scrim').hidden = true; document.body.style.overflow = ''; }
$('sheetClose').addEventListener('click', closeSheet);
$('scrim').addEventListener('click', e => { if (e.target === $('scrim')) closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

function openPeriod(i){
  const p = periodsAll()[i];
  const site = rowsFor('כל האתר')[i];
  let b = '<div class="kv"><span class="k">טווח</span><span class="v">' + dmy(p.period_start) + ' – ' + dmy(p.period_end) + '</span></div>'
        + '<div class="kv"><span class="k">ימים</span><span class="v">' + n0(p.period_days) + ' מתוך ' + n0(p.period_days_calendar) + '</span></div>'
        + '<div class="kv"><span class="k">סשנים בכל האתר</span><span class="v">' + n0(site.s) + '</span></div>';
  if (p.is_partial) b += '<div class="notice" style="margin:10px 0 0">' + esc(p.partial_note) + '. מוצג כמו שהוא, מוצא מכל חישוב מגמה.</div>';
  b += '<div class="blk"><h3>לפי נכס — ' + esc(DATA.paid_label[state.paid]) + '</h3>';
  const list = selectedPlats().map(pl => ({ n: pl, r: rowsFor(pl)[i] })).sort((a,b2) => b2.r.s - a.r.s);
  list.forEach(o => {
    const ch = (o.r.cs == null) ? '' :
      ' <span class="na">' + (o.r.cc && o.r.cp != null ? pcts(o.r.cp) : n0s(o.r.cs) + ' סשנים') + '</span>';
    b += '<div class="kv"><span class="k"><span class="swatch" style="background:' + platMeta[o.n].color + '"></span>'
       + esc(o.n) + '</span><span class="v">' + n0(o.r.s) + ' · ' + pct(o.r.sh) + ch + '</span></div>';
  });
  b += '</div>';
  b += '<div class="blk"><h3>איך לקרוא את השינוי</h3><ul>'
     + '<li>אחוז שינוי מוצג רק כשהתקופה הקודמת באותו אורך ומעל 100 סשנים. אחרת מוצג השינוי בכמות בלבד.</li>'
     + '<li>הנתח נמדד בנקודות אחוז, לא באחוזים. אלה שני מדדים שונים.</li></ul></div>';
  openSheet(p.period_label + (p.is_partial ? ' (חלקי)' : ''), b);
}

window.owlBuildNav = function(asIdo){
  var role = (window.OWL_ROLE || {});
  if (asIdo) role = { noprofit: true, owner: false };
  var h = '';
  OWLNAV.forEach(function(it){
    if (it[0] === 'g') { h += '<div class="owlg">' + it[1] + '</div>'; return; }
    // כלל קבוע: המשתמש ללא רווח אינו רואה מסך שמציג רווח, לא בכסף ולא באחוזים.
    if (it[2] === 'profit' && role.noprofit) return;
    h += '<a href="/?v=' + it[0] + '">' + it[1] + '</a>';
  });
  // The agent report is open to every logged-in user and its profit figures
  // are stripped server-side, so hiding it here would make the preview show
  // something the real page does not.
  h += '<div class="owlg">ניתוח</div>'
     + '<a href="/agent-report">ניתוח ביצועי נציגים וסניפים</a>';
  if (!role.noprofit) {
    h += '<div class="owlsys"><div class="st">מערכת ניטור ואנליטיקת פרסום</div>'
       + '<div class="owlcur" aria-current="page">תמהיל מקורות התנועה</div></div>';
  }
  document.getElementById('owllist').innerHTML = h;
};

/* ---------- view-as ----------
   The mode lives in localStorage under the same key the main dashboard uses,
   so a choice made there is still in force here and the other way round.
   This HIDES; it does not protect. The real gate is the server, and it was
   measured by logging in as five different people. */
(function(){
  if (!(window.OWL_ROLE || {}).owner) return;
  var KEY = 'divani_preview_user';
  var OK = ['user', 'ido', 'user-video', 'ido-video'];
  function get(){ try { var v = localStorage.getItem(KEY);
    return OK.indexOf(v) >= 0 ? v : ''; } catch (e) { return ''; } }
  function set(m){ try { if (m) localStorage.setItem(KEY, m); else localStorage.removeItem(KEY); } catch (e) {} }
  // ?me=1 restores his own view on any device, and is the way back when the
  // recording modes have left nothing on screen to press. It must run BEFORE
  // anything reads the stored mode.
  try{
    if (/[?&]me=1/.test(location.search)) {
      set('');
      history.replaceState(null, '', location.pathname);
    }
  }catch(e){}

  var ovl = document.getElementById('vaovl'), btn = document.getElementById('vaeye');

  function apply(){
    var m = get(), base = m.replace('-video', '');
    document.body.classList.toggle('as-user', base === 'user');
    document.body.classList.toggle('as-ido',  base === 'ido');
    // in the video modes the eye goes too, so a screen recording shows exactly
    // what they have and nothing more
    btn.style.display = /-video$/.test(m) ? 'none' : '';
    btn.classList.toggle('on', m !== '');
    // בלי כיתוב. הוא בחר מהרשימה, ולכן הוא יודע מה בחר — העין הדלוקה והשורה
    // המסומנת הן כל הסימון שצריך.
    if (window.owlBuildNav) window.owlBuildNav(base === 'ido');
    paint();
  }
  function paint(){
    var m = get();
    [].forEach.call(document.querySelectorAll('[data-va]'), function(r){
      var on = r.getAttribute('data-va') === m;
      r.classList.toggle('on', on);
      r.setAttribute('aria-checked', on ? 'true' : 'false');
    });
  }
  function open(){ paint(); ovl.classList.add('on'); btn.setAttribute('aria-expanded', 'true');
    document.body.style.overflow = 'hidden'; var f = ovl.querySelector('.varow'); if (f) f.focus(); }
  function close(){ ovl.classList.remove('on'); btn.setAttribute('aria-expanded', 'false');
    document.body.style.overflow = ''; btn.focus(); }

  btn.addEventListener('click', open);
  document.getElementById('vax').addEventListener('click', close);
  ovl.addEventListener('click', function(e){ if (e.target === ovl) close(); });
  ovl.addEventListener('click', function(e){
    var r = e.target.closest('[data-va]'); if (!r) return;
    set(r.getAttribute('data-va')); apply(); close();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && ovl.classList.contains('on')) { e.stopPropagation(); close(); }
  }, true);
  // The way back out of a video mode cannot be on screen - it would appear in
  // the recording. A one-second press on the system logo restores his own view.
  (function(el){
    if (!el) return;
    el.style.touchAction = 'manipulation';
    el.style.webkitTouchCallout = 'none';
    el.style.userSelect = 'none';
    var out = function(){ if (!get()) return; set(''); apply(); };
    // pointercancel is NOT a cancel here: on a phone the browser fires it when
    // it starts its own long-press gesture, which is when this must survive.
    var t = null, stop = function(){ if (t) { clearTimeout(t); t = null; } };
    el.addEventListener('pointerdown', function(){ stop(); t = setTimeout(out, 900); });
    ['pointerup','pointerleave'].forEach(function(k){ el.addEventListener(k, stop); });
    el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
    var n = 0, tt = null;
    el.addEventListener('click', function(){
      n++; clearTimeout(tt);
      if (n >= 3) { n = 0; out(); return; }
      tt = setTimeout(function(){ n = 0; }, 1200);
    });
  })(document.querySelector('.owllogo'));
  // חזרה למסך מלשונית אחרת שבה שונתה התצוגה
  window.addEventListener('storage', function(e){ if (e.key === KEY) apply(); });
  window.addEventListener('pageshow', apply);
  apply();
})();
/*ENDOWNER*/

/* ---------- chips ---------- */
function buildChips(){
  const c = $('chips');
  let h = '';
  DATA.platforms.forEach((p,i) => {
    if (p.kind !== 'פלטפורמה' && (i === 0 || DATA.platforms[i-1].kind === 'פלטפורמה')) h += '<div class="chipsep"></div>';
    h += '<button type="button" class="chip" data-p="' + esc(p.name) + '" style="color:' + p.color + '" '
       + 'aria-pressed="' + (state.on.has(p.name) ? 'true' : 'false') + '">'
       + '<span class="dot"></span>' + esc(p.name)
       + (p.tag ? ' <span class="chiptag">' + esc(p.tag) + '</span>' : '') + '</button>';
  });
  h += '<div class="chipreset"><button type="button" id="chipreset">'
     + 'שחרור בחירות</button></div>';
  c.innerHTML = h;
  c.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const nm = btn.getAttribute('data-p');
      if (state.on.has(nm)) state.on.delete(nm); else state.on.add(nm);
      btn.setAttribute('aria-pressed', state.on.has(nm) ? 'true' : 'false');
      paintReset();
      render();
    });
  });
  // חוזר לבחירה שהמסך נפתח איתה, לא ל"הכל" ולא ל"כלום": זו הנקודה שממנה
  // הוא התחיל, ולכן זו הנקודה שאליה "שחרור" אמור להחזיר.
  $('chipreset').addEventListener('click', () => {
    state.on = new Set(DATA.default_on);
    c.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed',
      state.on.has(b.getAttribute('data-p')) ? 'true' : 'false'));
    paintReset();
    render();
  });
  paintReset();
}
function sameAsDefault(){
  const def = DATA.default_on;
  if (state.on.size !== def.length) return false;
  return def.every(n => state.on.has(n));
}
function paintReset(){
  const b = $('chipreset'); if (!b) return;
  b.disabled = sameAsDefault();
}

/* ---------- wiring ---------- */
function seg(id, key, after){
  $(id).querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      state[key] = b.getAttribute('data-v');
      $(id).querySelectorAll('button').forEach(x =>
        x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
      if (after) after();
      render();
    });
  });
}
seg('segType','ptype');
seg('segMeasure','measure');
seg('segPaid','paid');

$('dFrom').min = MIN_D; $('dFrom').max = MAX_D; $('dFrom').value = state.from;
$('dTo').min   = MIN_D; $('dTo').max   = MAX_D; $('dTo').value   = state.to;
$('dFrom').addEventListener('change', () => { state.from = $('dFrom').value || MIN_D; render(); });
$('dTo').addEventListener('change',   () => { state.to   = $('dTo').value   || MAX_D; render(); });
$('quick').querySelectorAll('button').forEach(b => {
  b.addEventListener('click', () => {
    const q = b.getAttribute('data-q');
    const map = { all:[MIN_D,MAX_D], h2:['2026-05-01',MAX_D], q3:['2026-07-01',MAX_D], aug:['2026-08-01',MAX_D] };
    state.from = map[q][0]; state.to = map[q][1];
    $('dFrom').value = state.from; $('dTo').value = state.to;
    render();
  });
});
$('perBtn').addEventListener('click', () => {
  const open = !$('perPanel').hidden;
  $('perPanel').hidden = open;
  $('perBtn').textContent = open ? 'פתיחת טבלת תקופות' : 'סגירת טבלת תקופות';
  if (!open){ buildPeriodTable(); $('perPanel').scrollIntoView({behavior:'smooth',block:'start'}); }
});
$('perClose').addEventListener('click', () => {
  $('perPanel').hidden = true;
  $('perBtn').textContent = 'פתיחת טבלת תקופות';
});
let rt;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(drawChart, 120); });

/* ---------- render ---------- */
function render(){
  const idx = idxInRange(), per = periodsAll();
  $('subline').textContent = dmy(MIN_D) + ' – ' + dmy(MAX_D) + ' · המדד: ' + DATA.meta.measure_short;
  $('chartTitle').textContent =
    (state.measure === 'sessions' ? 'סשנים' : 'נתח מהאתר %') + ' · '
    + (state.ptype === 'חודש' ? 'תצוגה חודשית' : 'תצוגה שבועית') + ' · '
    + DATA.paid_label[state.paid];
  $('rangenote').textContent = idx.length
    ? ('בטווח שנבחר: ' + idx.length + ' ' + (state.ptype === 'חודש' ? 'חודשים' : 'שבועות')
       + ' · ' + per[idx[0]].period_label + ' עד ' + per[idx[idx.length-1]].period_label
       + '. תקופה שאינה נכללת במלואה בטווח אינה מוצגת.')
    : 'אין תקופה שנכללת במלואה בטווח שנבחר. הרחיבו את הטווח.';
  const partials = idx.filter(i => per[i].is_partial).length;
  $('legendline').innerHTML = 'הזמן זורם מימין לשמאל. '
    + (partials ? 'הרקע האפור מסמן תקופה חלקית — היא מוצגת כמו שהיא ומוצאת מכל חישוב מגמה. ' : '')
    + 'הקישו על נכס למעלה כדי לכבות או להדליק אותו בגרף.';
  drawChart();
  buildSummary();
  if (!$('perPanel').hidden) buildPeriodTable();
}

/*OWNER*/
if (OWNERDATA) $('noticeText').textContent = OWNERDATA.notice;
/*ENDOWNER*/
$('foot').innerHTML = esc(DATA.meta.foot);
buildChips();
render();
</script>
