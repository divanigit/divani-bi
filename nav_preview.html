 <div class="frwrap"><iframe class="fr0" data-on srcdoc="<!doctype html>
<html lang=&quot;he&quot; dir=&quot;rtl&quot;>

<style>
  :root{
    --bd:#0d9668; --bg:#ffffff; --surface:#f4f8f6; --line:#e2e9e5; --line2:#cdd8d2;
    --tx:#18241f; --tx2:#53635c; --tx3:#8a978f;

    --scrim:rgba(16,28,23,.44);
    --panelShadow:-14px 0 40px rgba(16,28,23,.16);
    --barShadow:0 1px 0 var(--line), 0 6px 16px rgba(16,28,23,.05);
    --ease:cubic-bezier(.32,.72,0,1);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bd:#2fbf8f; --bg:#0f1512; --surface:#19211d; --line:#26302b; --line2:#35423b;
      --tx:#e9efeb; --tx2:#a2b0a9; --tx3:#6f7d76;
      --accentSoft:rgba(47,191,143,.16);
      --scrim:rgba(0,0,0,.58);
      --panelShadow:-14px 0 44px rgba(0,0,0,.5);
      --barShadow:0 1px 0 var(--line), 0 6px 18px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overflow-x:hidden}
  body{
    background:var(--bg); color:var(--tx);
    font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,&quot;Helvetica Neue&quot;,Arial,&quot;Noto Sans Hebrew&quot;,sans-serif;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    min-height:100vh;
  }
  body.lock{overflow:hidden}
  .ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}

  /* ===== Top bar (always visible = &quot;where am I&quot;) ===== */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    box-shadow:var(--barShadow);
    padding-top:env(safe-area-inset-top);
  }
  .topbar__inner{
    max-width:760px; margin:0 auto;
    min-height:58px; padding:8px 12px;
    display:flex; align-items:center; gap:10px;
  }
  .hz{display:flex; align-items:center; gap:12px; min-width:0}
  .hamb{
    width:44px; height:44px; border:none; background:transparent; color:var(--tx);
    border-radius:13px; display:grid; place-items:center; cursor:pointer; flex:none;
    transition:background .18s var(--ease), transform .12s var(--ease);
  }
  .hamb:hover{background:var(--surface)}
  .hamb:active{transform:scale(.94)}
  .hamb:focus-visible{outline:2px solid var(--bd); outline-offset:2px}
  .hamb .ic{width:22px;height:22px;stroke-width:1.9}

  .loc{display:flex; flex-direction:column; justify-content:center; min-width:0; line-height:1.2}
  .loc__k{
    display:flex; align-items:center; gap:6px;
    font-size:11px; font-weight:600; color:var(--tx3); letter-spacing:.03em;
  }
  .loc__dot{width:7px;height:7px;border-radius:50%;background:var(--bd);flex:none}
  .loc__v{
    font-size:16.5px; font-weight:700; color:var(--tx);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px;
  }
  .brand{
    margin-inline-start:auto; width:34px; height:34px; border-radius:10px; flex:none;
    background:var(--bd); color:#fff; display:grid; place-items:center;
    box-shadow:0 2px 8px rgba(13,150,104,.28);
  }
  .brand .ic{width:18px;height:18px;stroke-width:2.1}

  /* ===== Content stub ===== */
  .wrap{max-width:760px; margin:0 auto; padding:22px 16px 60px}
  .card{
    background:var(--bg); border:1px solid var(--line); border-radius:18px;
    padding:24px 20px; box-shadow:0 1px 2px rgba(16,28,23,.04);
  }
  .card__ic{
    width:52px;height:52px;border-radius:15px;background:var(--accentSoft);color:var(--bd);
    display:grid;place-items:center;margin-bottom:16px;
  }
  .card__ic .ic{width:26px;height:26px;stroke-width:1.8}
  .card__title{font-size:23px;font-weight:800;letter-spacing:-.01em;margin:0}
  .card__sub{margin:8px 0 0;font-size:14.5px;color:var(--tx2);line-height:1.55}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
  .tile{background:var(--surface);border-radius:14px;padding:14px 12px;min-height:74px}
  .tile__l{width:46%;height:9px;border-radius:5px;background:var(--line2);opacity:.8}
  .tile__b{width:70%;height:16px;border-radius:6px;background:var(--line2);margin-top:12px;opacity:.55}
  .hint{margin:20px 4px 0;font-size:13px;color:var(--tx3);text-align:center}

  /* ===== Drawer ===== */
  .scrim{
    position:fixed; inset:0; z-index:40;
    background:var(--scrim);
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .26s var(--ease), visibility 0s linear .26s;
    -webkit-backdrop-filter:blur(1.5px); backdrop-filter:blur(1.5px);
  }
  .scrim.open{opacity:1; visibility:visible; pointer-events:auto;
    transition:opacity .26s var(--ease), visibility 0s;}
  .panel{
    position:absolute; top:0; bottom:0; right:0;
    width:86%; max-width:360px;
    background:var(--bg); box-shadow:var(--panelShadow);
    transform:translateX(101%);
    transition:transform .3s var(--ease);
    display:flex; flex-direction:column;
    border-inline-start:1px solid var(--line);
  }
  .scrim.open .panel{transform:translateX(0)}
  .panel__head{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px 14px; padding-top:calc(16px + env(safe-area-inset-top));
    border-bottom:1px solid var(--line);
  }
  .panel__title{font-size:18px;font-weight:800;margin:0}
  .xbtn{
    width:44px;height:44px;border:none;background:transparent;color:var(--tx2);
    border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none;
    transition:background .18s var(--ease), color .18s var(--ease), transform .12s var(--ease);
  }
  .xbtn:hover{background:var(--surface);color:var(--tx)}
  .xbtn:active{transform:scale(.94)}
  .xbtn:focus-visible{outline:2px solid var(--bd);outline-offset:2px}
  .xbtn .ic{width:22px;height:22px}

  .list{flex:1;overflow-y:auto;overscroll-behavior:contain;
    padding:12px 12px calc(20px + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling:touch;}
  .grp{margin-top:14px}
  .grp:first-child{margin-top:2px}
  .grp__h{
    font-size:11.5px;font-weight:700;color:var(--tx3);letter-spacing:.05em;
    padding:6px 12px 8px;
  }
  .grp--sep{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}

  .row{
    display:flex; align-items:center; gap:13px;
    width:100%; min-height:50px; padding:11px 14px;
    border:none; background:transparent; cursor:pointer;
    border-radius:13px; color:var(--tx); text-align:start;
    font-size:15.5px; font-weight:500; font-family:inherit;
    position:relative;
    transition:background .16s var(--ease), color .16s var(--ease);
  }
  .row .ic{color:var(--tx2);transition:color .16s var(--ease)}
  .row:hover{background:var(--surface)}
  .row:active{background:var(--accentSoft)}
  .row:focus-visible{outline:2px solid var(--bd);outline-offset:-2px}
  .row__label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row__ext{color:var(--tx3);flex:none}
  .row__ext .ic{width:17px;height:17px;color:inherit}

  .row.is-active{background:var(--accentSoft);color:var(--bd);font-weight:700}
  .row.is-active .ic{color:var(--bd)}
  .row.is-active::before{
    content:&quot;&quot;; position:absolute; right:0; top:50%; transform:translateY(-50%);
    width:3.5px; height:24px; border-radius:0 4px 4px 0; background:var(--bd);
  }
  .row__check{margin-inline-start:auto;color:var(--bd);flex:none;opacity:0;transition:opacity .16s}
  .row.is-active .row__check{opacity:1}
  .row__check .ic{width:18px;height:18px;stroke-width:2.2}

  @media (min-width:600px){
    .card{padding:28px 26px}
  }
</style>
</head>
<body>

  <!-- ===== Slim always-visible top bar ===== -->
  <header class=&quot;topbar&quot;>
    <div class=&quot;topbar__inner&quot;>
      <div class=&quot;hz&quot;>
        <button class=&quot;hamb&quot; id=&quot;hambBtn&quot; aria-label=&quot;פתיחת תפריט דוחות&quot; aria-haspopup=&quot;dialog&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;drawer&quot;>
          <svg class=&quot;ic&quot; viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;><path d=&quot;M3.5 7h17&quot;/><path d=&quot;M3.5 12h17&quot;/><path d=&quot;M3.5 17h17&quot;/></svg>
        </button>
        <div class=&quot;loc&quot;>
          <span class=&quot;loc__k&quot;><span class=&quot;loc__dot&quot;></span>מיקום נוכחי</span>

        <svg class=&quot;ic&quot; viewBox=&quot;0 0 24 24&quot;><path d=&quot;M5 20V11&quot;/><path d=&quot;M12 20V4&quot;/><path d=&quot;M19 20v-6&quot;/></svg>

  <!-- ===== Content stub ===== -->
  <main class=&quot;wrap&quot;>

  </main>

  <!-- ===== Drawer ===== -->
  <div class=&quot;scrim&quot; id=&quot;scrim&quot;>
    <nav class=&quot;panel&quot; id=&quot;drawer&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-label=&quot;דוחות&quot; tabindex=&quot;-1&quot;>
      <div class=&quot;panel__head&quot;>

        </button>
      </div>
      <div class=&quot;list&quot; id=&quot;list&quot;></div>

  </div>

<script>
(function(){

  var ICON = {

    branches:'<path d=&quot;M3 9l1.6-4.4A1 1 0 0 1 5.5 4h13a1 1 0 0 1 .9.6L21 9&quot;/><path d=&quot;M4.5 9v9a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V9&quot;/><path d=&quot;M3 9h18&quot;/><path d=&quot;M9.5 20v-5h5v5&quot;/>',

    segmentation:'<path d=&quot;M12 12V3.2A8.8 8.8 0 1 0 20.8 12H12z&quot;/><path d=&quot;M14.5 3.9A8.8 8.8 0 0 1 20.1 9.5H14.5z&quot;/>',
    insights:'<path d=&quot;M9.5 18.5h5&quot;/><path d=&quot;M10.5 21.5h3&quot;/><path d=&quot;M12 2.8a6 6 0 0 0-3.9 10.5c.75.7 1.1 1.5 1.15 2.5h5.5c.05-1 .4-1.8 1.15-2.5A6 6 0 0 0 12 2.8z&quot;/>',

  function svg(name, cls){
    return '<svg class=&quot;ic '+(cls||'')+'&quot; viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;>'+ICON[name]+'</svg>';
  }

  var GROUPS = [

      { id:'agents',  label:'סוכנים',      icon:'agents' },

    { title:'ניתוח', sep:false, items:[
      { id:'segmentation', label:'פילוח',  icon:'segmentation' },
      { id:'insights',     label:'תובנות', icon:'insights' }
    ]},
    { title:'דוח נפרד', sep:true, items:[
      { id:'reps', label:'ביצועי נציגים', icon:'reps', external:true }

  ];

  var ALL = {};
  GROUPS.forEach(function(g){ g.items.forEach(function(it){ ALL[it.id]=it; }); });

  var state = { current:'agents' };

  var scrim   = document.getElementById('scrim');
  var drawer  = document.getElementById('drawer');
  var listEl  = document.getElementById('list');
  var hambBtn = document.getElementById('hambBtn');
  var closeBtn= document.getElementById('closeBtn');
  var nameEl  = document.getElementById('currentName');
  var content = document.getElementById('content');
  var lastFocus = null;

  /* ---- build drawer list ---- */
  function buildList(){
    var html = '';
    GROUPS.forEach(function(g){
      html += '<div class=&quot;grp'+(g.sep?' grp--sep':'')+'&quot;>';
      html += '<div class=&quot;grp__h&quot;>'+g.title+'</div>';
      g.items.forEach(function(it){
        html += '<button class=&quot;row&quot; role=&quot;menuitem&quot; data-id=&quot;'+it.id+'&quot;'+(it.external?' data-ext=&quot;1&quot;':'')+'>';
        html += svg(it.icon);
        html += '<span class=&quot;row__label&quot;>'+it.label+'</span>';
        if(it.external){
          html += '<span class=&quot;row__ext&quot; aria-label=&quot;נפתח בעמוד חדש&quot;>'+svg('ext')+'</span>';
        }else{
          html += '<span class=&quot;row__check&quot;>'+svg('check')+'</span>';
        }
        html += '</button>';
      });
      html += '</div>';
    });
    listEl.innerHTML = html;
    Array.prototype.forEach.call(listEl.querySelectorAll('.row'), function(btn){
      btn.addEventListener('click', function(){
        select(btn.getAttribute('data-id'), btn.getAttribute('data-ext')==='1');
      });
    });
  }

  function markActive(){
    Array.prototype.forEach.call(listEl.querySelectorAll('.row'), function(btn){
      var on = btn.getAttribute('data-id')===state.current &amp;&amp; btn.getAttribute('data-ext')!=='1';

  }

  /* ---- content ---- */
  function renderContent(){
    var it = ALL[state.current];
    content.innerHTML =
      '<div class=&quot;card__ic&quot;>'+svg(it.icon,'')+'</div>'+
      '<h1 class=&quot;card__title&quot;>מציג: '+it.label+'</h1>'+
      '<p class=&quot;card__sub&quot;>זהו אזור תוכן לדוגמה. במערכת האמיתית כאן ייטען דוח «'+it.label+'» עם הנתונים והגרפים שלו.</p>'+
      '<div class=&quot;tiles&quot;>'+
        '<div class=&quot;tile&quot;><div class=&quot;tile__l&quot;></div><div class=&quot;tile__b&quot;></div></div>'+
        '<div class=&quot;tile&quot;><div class=&quot;tile__l&quot;></div><div class=&quot;tile__b&quot;></div></div>'+
        '<div class=&quot;tile&quot;><div class=&quot;tile__l&quot;></div><div class=&quot;tile__b&quot;></div></div>'+
      '</div>';
  }

  function renderExternal(it){
    content.innerHTML =
      '<div class=&quot;card__ic&quot;>'+svg(it.icon,'')+'</div>'+
      '<h1 class=&quot;card__title&quot;>היה נפתח עמוד: '+it.label+'</h1>'+
      '<p class=&quot;card__sub&quot;>דוח זה נפתח בעמוד נפרד, לכן המיקום הנוכחי בפס העליון נשאר על הדוח הקודם.</p>';

  function select(id, isExt){
    var it = ALL[id];
    if(isExt){
      renderExternal(it);   // transient: does not become the &quot;current&quot; location
      closeDrawer();
      return;

    state.current = id;
    nameEl.textContent = it.label;

    renderContent();

  /* ---- drawer open/close ---- */
  function openDrawer(){
    lastFocus = document.activeElement;
    scrim.classList.add('open');

    scrim.classList.remove('open');
    document.body.classList.remove('lock');

<script>
(function(){
  var S = function(p){return '<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.7&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; aria-hidden=&quot;true&quot;>'+p+'</svg>';};
  var IC = {

    ops:     S('<path d=&quot;M4 6h9&quot;/><path d=&quot;M19 6h1&quot;/><circle cx=&quot;15.5&quot; cy=&quot;6&quot; r=&quot;2&quot;/><path d=&quot;M4 12h5&quot;/><path d=&quot;M13 12h7&quot;/><circle cx=&quot;11&quot; cy=&quot;12&quot; r=&quot;2&quot;/><path d=&quot;M4 18h9&quot;/><path d=&quot;M19 18h1&quot;/><circle cx=&quot;15.5&quot; cy=&quot;18&quot; r=&quot;2&quot;/>'),

    report:  S('<path d=&quot;M8 3h6l4 4v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z&quot;/><path d=&quot;M14 3v4h4&quot;/>'),

    sources: S('<circle cx=&quot;12&quot; cy=&quot;10&quot; r=&quot;2.8&quot;/><path d=&quot;M12 21s-6-5.2-6-11a6 6 0 0 1 12 0c0 5.8-6 11-6 11z&quot;/>'),
    cash:    S('<rect x=&quot;3&quot; y=&quot;6&quot; width=&quot;18&quot; height=&quot;12&quot; rx=&quot;2.5&quot;/><circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;2.4&quot;/><path d=&quot;M6.5 9.5h.01&quot;/><path d=&quot;M17.5 14.5h.01&quot;/>'),
    service: S('<path d=&quot;M5 13.5v-1.5a7 7 0 0 1 14 0v1.5&quot;/><rect x=&quot;3&quot; y=&quot;13&quot; width=&quot;4&quot; height=&quot;6&quot; rx=&quot;1.6&quot;/><rect x=&quot;17&quot; y=&quot;13&quot; width=&quot;4&quot; height=&quot;6&quot; rx=&quot;1.6&quot;/><path d=&quot;M19 19a4 4 0 0 1-4 3h-2&quot;/>'),
    advances:S('<rect x=&quot;3&quot; y=&quot;6&quot; width=&quot;18&quot; height=&quot;13&quot; rx=&quot;2.5&quot;/><path d=&quot;M3 10.5h18&quot;/><circle cx=&quot;16.5&quot; cy=&quot;14.5&quot; r=&quot;1.3&quot;/>'),
    seg:     S('<circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;8.3&quot;/><path d=&quot;M12 12V3.7&quot;/><path d=&quot;M12 12l7.1 4.2&quot;/>'),
    insights:S('<path d=&quot;M9.5 18h5&quot;/><path d=&quot;M10.5 21h3&quot;/><path d=&quot;M12 3a6 6 0 0 0-3.7 10.7c.7.6 1.2 1.3 1.2 2.3h5c0-1 .5-1.7 1.2-2.3A6 6 0 0 0 12 3z&quot;/>'),

  function updateChips(){

    cat.reports.forEach(function(rep){
      var isActive = (!rep.external &amp;&amp; rep.id===active);

  updateChips();
  renderContent('report');

  .showing{font-size:25px; font-weight:800; letter-spacing:-.02em; margin:3px 0 0}
  .showing span{color:var(--bd)}
  .hint{color:var(--tx2); font-size:13px; margin:7px 0 24px}
  .tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:12px}
  .tile{
    background:var(--surface); border:1px solid var(--line); border-radius:15px;
    padding:13px 12px; display:flex; flex-direction:column; gap:9px; justify-content:center;
  }
  .tile i{display:block; border-radius:5px; background:var(--line2)}
  .tile i.a{width:58%; height:8px}
  .tile i.b{width:44%; height:17px; background:var(--brand-soft)}
  .panel{
    position:relative; height:150px; border-radius:18px; overflow:hidden;
    background:var(--surface); border:1px solid var(--line);
  }
  .panel svg{position:absolute; inset:0; width:100%; height:100%}

  /* ---------- external / new-page state ---------- */
  .ext-emblem{background:var(--brand-soft); color:var(--bd)}
  .backlink{
    margin-top:22px; appearance:none; font-family:inherit; cursor:pointer;
    background:var(--bd); color:#fff; border:0; border-radius:13px;
    padding:12px 20px; font-size:14px; font-weight:700; min-height:46px;
  }
  .backlink:active{transform:scale(.97)}

  /* ---------- bottom tab bar ---------- */
  .tabbar{position:fixed; inset:auto 0 0 0; z-index:40; background:var(--bg); border-top:1px solid var(--line)}
  @supports (backdrop-filter:blur(1px)){
    .tabbar{background:color-mix(in srgb,var(--bg) 84%,transparent); backdrop-filter:blur(18px) saturate(1.4)}
  }
  .tabs{max-width:520px; margin:0 auto; display:flex; padding:7px 6px calc(7px + env(safe-area-inset-bottom))}
  .tab{
    flex:1 1 0; min-width:0; appearance:none; background:none; border:0; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:4px; padding:5px 2px 3px;
    color:var(--tx2); font-family:inherit; min-height:56px;
    transition:color .18s ease; -webkit-tap-highlight-color:transparent;
  }
  .tab .iw{position:relative; width:58px; max-width:100%; height:31px; display:grid; place-items:center; border-radius:16px}
  .tab .iw::before{
    content:&quot;&quot;; position:absolute; inset:0; border-radius:16px; background:var(--bd);
    opacity:0; transform:scale(.6); transition:opacity .22s ease, transform .28s cubic-bezier(.22,.9,.3,1);
  }
  .tab .iw svg{position:relative; width:23px; height:23px}
  .tab .lb{font-size:11px; font-weight:600; line-height:1; white-space:nowrap}
  .tab.active{color:var(--bd)}
  .tab.active .iw::before{opacity:.15; transform:scale(1)}
  .tab:active{transform:scale(.93)}
  .tab:active .iw{background:var(--brand-weak)}

  /* ---------- more sheet ---------- */
  .scrim{
    position:fixed; inset:0; z-index:50; background:var(--scrim);
    opacity:0; visibility:hidden; transition:opacity .26s ease, visibility .26s ease;
  }
  .scrim.open{opacity:1; visibility:visible}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:60; max-width:520px; margin:0 auto;
    background:var(--bg); border:1px solid var(--line); border-bottom:0;
    border-top-left-radius:24px; border-top-right-radius:24px;
    transform:translateY(106%); transition:transform .34s cubic-bezier(.32,.72,0,1);
    padding:8px 0 calc(14px + env(safe-area-inset-bottom));
    box-shadow:0 -20px 55px -22px rgba(0,0,0,.45);
  }
  .sheet.open{transform:translateY(0)}
  .grab{width:42px; height:5px; border-radius:3px; background:var(--line2); margin:6px auto 2px}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; padding:10px 16px 4px}
  .sheet-head h2{margin:0; font-size:16px; font-weight:800}
  .x{
    appearance:none; border:0; cursor:pointer; background:var(--surface); color:var(--tx2);
    width:38px; height:38px; border-radius:50%; display:grid; place-items:center;
  }
  .x svg{width:18px; height:18px}
  .x:active{transform:scale(.9)}
  .sheet-body{padding:2px 10px}
  .glabel{font-size:11px; font-weight:700; color:var(--tx3); letter-spacing:.03em; padding:14px 10px 4px}
  .row{
    width:100%; appearance:none; border:0; background:none; cursor:pointer; font-family:inherit;
    color:var(--tx); display:flex; align-items:center; gap:14px; text-align:right;
    padding:11px 10px; border-radius:15px; min-height:56px; transition:background .15s ease;
  }
  .row:active{background:var(--surface); transform:scale(.99)}
  .row .ri{
    width:42px; height:42px; border-radius:13px; flex:none; display:grid; place-items:center;
    background:var(--surface); border:1px solid var(--line); color:var(--tx2);
  }
  .row .ri svg{width:22px; height:22px}
  .row .rt{flex:1; min-width:0}
  .row .rn{font-size:15px; font-weight:700}
  .row .rs{font-size:12px; color:var(--tx3); margin-top:1px}
  .row .chev{color:var(--tx3); flex:none; display:grid; place-items:center}
  .row .chev svg{width:20px; height:20px}
  .row.active{background:var(--brand-weak)}
  .row.active .ri{background:var(--bd); border-color:var(--bd); color:#fff}
  .row.active .rn{color:var(--bd)}
  .row .rs .arr{display:inline-flex; align-items:center; gap:3px; color:var(--bd); font-weight:700}
  .row .rs .arr svg{width:12px; height:12px}

  :focus-visible{outline:2px solid var(--bd); outline-offset:2px; border-radius:12px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
  <div class=&quot;app&quot;>
    <header class=&quot;topbar&quot;>
      <div class=&quot;mark&quot; aria-hidden=&quot;true&quot;>
        <svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;><path d=&quot;M4 20V9m5 11V4m5 16v-7m5 7V8&quot;/></svg>
      </div>
      <div class=&quot;tt&quot;>
        <span class=&quot;kick&quot; id=&quot;topKick&quot;>מכירות</span>
        <h1 class=&quot;name&quot; id=&quot;topName&quot;>סניפים</h1>
      </div>
    </header>

    <main class=&quot;content&quot; id=&quot;content&quot; role=&quot;main&quot;></main>

    <nav class=&quot;tabbar&quot; aria-label=&quot;ניווט דוחות&quot;>
      <div class=&quot;tabs&quot; id=&quot;tabs&quot; role=&quot;tablist&quot;></div>
    </nav>
  </div>

  <div class=&quot;scrim&quot; id=&quot;scrim&quot; hidden></div>
  <section class=&quot;sheet&quot; id=&quot;sheet&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-labelledby=&quot;sheetTitle&quot; hidden>
    <div class=&quot;grab&quot; aria-hidden=&quot;true&quot;></div>
    <div class=&quot;sheet-head&quot;>
      <h2 id=&quot;sheetTitle&quot;>עוד דוחות</h2>
      <button class=&quot;x&quot; id=&quot;closeSheet&quot; aria-label=&quot;סגירה&quot;>
        <svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;><path d=&quot;M18 6 6 18M6 6l12 12&quot;/></svg>
      </button>
    </div>
    <div class=&quot;sheet-body&quot; id=&quot;sheetBody&quot;></div>
  </section>

<script>
(function(){
  var S = 'stroke=&quot;currentColor&quot; stroke-width=&quot;1.7&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;';
  var ICON = {
    senifim:'<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; '+S+'><path d=&quot;M3.5 9.5 5 5h14l1.5 4.5&quot;/><path d=&quot;M4.5 9.5v9a1 1 0 0 0 1 1h13a1 1 0 0 0 1-1v-9&quot;/><path d=&quot;M3.5 9.5a2.4 2.4 0 0 0 4.7 0 2.4 2.4 0 0 0 4.7 0 2.4 2.4 0 0 0 4.7 0&quot;/><path d=&quot;M9.5 19.5V15h5v4.5&quot;/></svg>',
    sochnim:'<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; '+S+'><path d=&quot;M15.5 20v-1.2a3.8 3.8 0 0 0-3.8-3.8H7.3a3.8 3.8 0 0 0-3.8 3.8V20&quot;/><circle cx=&quot;9.5&quot; cy=&quot;8&quot; r=&quot;3.2&quot;/><path d=&quot;M20.5 20v-1.2a3.8 3.8 0 0 0-2.9-3.7&quot;/><path d=&quot;M15.6 4.6a3.2 3.2 0 0 1 0 6.1&quot;/></svg>',
    pilug:'<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; '+S+'><path d=&quot;M21.2 15.9A10 10 0 1 1 8 2.8&quot;/><path d=&quot;M22 12A10 10 0 0 0 12 2v10z&quot;/></svg>',
    tovanot:'<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; '+S+'><path d=&quot;M9 18h6&quot;/><path d=&quot;M10 22h4&quot;/><path d=&quot;M15.1 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5.76.76 1.23 1.52 1.41 2.5&quot;/></svg>',
    more:'<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; '+S+'><rect x=&quot;3&quot; y=&quot;3&quot; width=&quot;7&quot; height=&quot;7&quot; rx=&quot;1.6&quot;/><rect x=&quot;14&quot; y=&quot;3&quot; width=&quot;7&quot; height=&quot;7&quot; rx=&quot;1.6&quot;/><rect x=&quot;3&quot; y=&quot;14&quot; width=&quot;7&quot; height=&quot;7&quot; rx=&quot;1.6&quot;/><rect x=&quot;14&quot; y=&quot;14&quot; width=&quot;7&quot; height=&quot;7&quot; rx=&quot;1.6&quot;/></svg>',
    mekorot:'<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; '+S+'><path d=&quot;M3 5h18l-7 8v6l-4 2v-8z&quot;/></svg>',
    mezuman:'<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; '+S+'><rect x=&quot;2&quot; y=&quot;6&quot; width=&quot;20&quot; height=&quot;12&quot; rx=&quot;2.4&quot;/><circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;2.6&quot;/><path d=&quot;M6 12h.01M18 12h.01&quot;/></svg>',
    sherut:'<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; '+S+'><path d=&quot;M3 13a9 9 0 0 1 18 0&quot;/><path d=&quot;M3 13h2.4a1 1 0 0 1 1 1v4.2a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2z&quot;/><path d=&quot;M21 13h-2.4a1 1 0 0 0-1 1v4.2a1 1 0 0 0 1 1H19a2 2 0 0 0 2-2z&quot;/></svg>',
    mikdamot:'<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; '+S+'><circle cx=&quot;8.5&quot; cy=&quot;8.5&quot; r=&quot;5.5&quot;/><path d=&quot;M18.4 10.9a5.5 5.5 0 1 1-7 7&quot;/><path d=&quot;M7.6 6.7h1v3.6&quot;/><path d=&quot;m16.4 14 .6.6-2.4 2.4&quot;/></svg>',
    nezigim:'<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; '+S+'><path d=&quot;M16 7h6v6&quot;/><path d=&quot;m22 7-8.5 8.5-5-5L2 17&quot;/></svg>',
    chev:'<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; '+S+'><path d=&quot;m14 6-6 6 6 6&quot;/></svg>',
    arr:'<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; '+S+'><path d=&quot;M7 17 17 7&quot;/><path d=&quot;M8 7h9v9&quot;/></svg>'
  };

  var REPORTS = {
    senifim:{name:'סניפים', group:'מכירות', icon:'senifim'},
    sochnim:{name:'סוכנים', group:'מכירות', icon:'sochnim'},
    pilug:{name:'פילוח', group:'ניתוח', icon:'pilug'},
    tovanot:{name:'תובנות', group:'ניתוח', icon:'tovanot'},
    mekorot:{name:'מקורות הגעה', group:'תפעול', icon:'mekorot'},
    mezuman:{name:'מזומן', group:'תפעול', icon:'mezuman'},
    sherut:{name:'שירות', group:'תפעול', icon:'sherut'},
    mikdamot:{name:'מקדמות', group:'תפעול', icon:'mikdamot'},
    nezigim:{name:'ביצועי נציגים', group:'דוח נפרד', icon:'nezigim', external:true}
  };

  var PRIMARY = ['senifim','sochnim','pilug','tovanot'];
  var SHEET = [
    {label:'תפעול', ids:['mekorot','mezuman','sherut','mikdamot']},
    {label:'דוח נפרד', ids:['nezigim']}
  ];

  var tabsEl = document.getElementById('tabs');
  var bodyEl = document.getElementById('sheetBody');
  var contentEl = document.getElementById('content');
  var topName = document.getElementById('topName');
  var topKick = document.getElementById('topKick');
  var scrim = document.getElementById('scrim');
  var sheet = document.getElementById('sheet');
  var closeBtn = document.getElementById('closeSheet');
  var moreTab;
  var current = 'senifim';
  var sheetOpen = false;

  /* build bottom tabs */
  PRIMARY.forEach(function(id){
    tabsEl.appendChild(makeTab(id, REPORTS[id].name, REPORTS[id].icon));
  });
  moreTab = makeTab('more', 'עוד', 'more');
  tabsEl.appendChild(moreTab);

  function makeTab(id, label, icon){
    var b = document.createElement('button');
    b.className = 'tab'; b.type = 'button'; b.dataset.id = id;
    b.setAttribute('role','tab');
    b.innerHTML = '<span class=&quot;iw&quot;>'+ICON[icon]+'</span><span class=&quot;lb&quot;>'+label+'</span>';
    b.addEventListener('click', function(){
      if(id === 'more'){ openSheet(); } else { select(id); }
    });
    return b;
  }

  /* build sheet rows */
  SHEET.forEach(function(g){
    var lab = document.createElement('div');
    lab.className = 'glabel'; lab.textContent = g.label;
    bodyEl.appendChild(lab);
    g.ids.forEach(function(id){
      var r = REPORTS[id];
      var btn = document.createElement('button');
      btn.className = 'row'; btn.type = 'button'; btn.dataset.id = id;
      var sub = r.external
        ? '<span class=&quot;arr&quot;>'+ICON.arr+' נפתח בעמוד חדש</span>'
        : r.group;
      var tail = r.external ? ICON.arr : ICON.chev;
      btn.innerHTML =
        '<span class=&quot;ri&quot;>'+ICON[r.icon]+'</span>'+
        '<span class=&quot;rt&quot;><span class=&quot;rn&quot;>'+r.name+'</span><span class=&quot;rs&quot;>'+sub+'</span></span>'+
        '<span class=&quot;chev&quot;>'+tail+'</span>';
      btn.addEventListener('click', function(){ select(id); });
      bodyEl.appendChild(btn);
    });
  });

  function select(id){
    var r = REPORTS[id];
    if(r.external){ renderExternal(r); closeSheet(); return; }
    current = id;
    topKick.textContent = r.group;
    topName.textContent = r.name;
    renderNormal(r);
    markTabs(id);
    markRows(id);
    closeSheet();
  }

  function markTabs(id){
    var primary = PRIMARY.indexOf(id) !== -1;
    Array.prototype.forEach.call(tabsEl.children, function(b){
      var tid = b.dataset.id;
      var on = (tid === 'more') ? !primary : (tid === id);
      b.classList.toggle('active', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
  }
  function markRows(id){
    Array.prototype.forEach.call(bodyEl.querySelectorAll('.row'), function(b){
      b.classList.toggle('active', b.dataset.id === id);
    });
  }

  function renderNormal(r){
    contentEl.innerHTML =
      '<section class=&quot;canvas&quot;>'+
        '<div class=&quot;emblem&quot;>'+ICON[r.icon]+'</div>'+
        '<div class=&quot;grp&quot;>קבוצה · '+r.group+'</div>'+
        '<h2 class=&quot;showing&quot;>מציג: <span>'+r.name+'</span></h2>'+
        '<p class=&quot;hint&quot;>כאן ייטען תוכן הדוח המלא</p>'+
        '<div class=&quot;tiles&quot; aria-hidden=&quot;true&quot;>'+
          '<div class=&quot;tile&quot;><i class=&quot;a&quot;></i><i class=&quot;b&quot;></i></div>'+
          '<div class=&quot;tile&quot;><i class=&quot;a&quot;></i><i class=&quot;b&quot;></i></div>'+
          '<div class=&quot;tile&quot;><i class=&quot;a&quot;></i><i class=&quot;b&quot;></i></div>'+
        '</div>'+
        '<div class=&quot;panel&quot; aria-hidden=&quot;true&quot;>'+spark()+'</div>'+
      '</section>';
  }

  function renderExternal(r){
    contentEl.innerHTML =
      '<section class=&quot;canvas&quot;>'+
        '<div class=&quot;emblem ext-emblem&quot;>'+ICON.arr+'</div>'+
        '<div class=&quot;grp&quot;>דוח נפרד</div>'+
        '<h2 class=&quot;showing&quot;>היה נפתח עמוד: <span>'+r.name+'</span></h2>'+
        '<p class=&quot;hint&quot;>דוח זה נפתח בעמוד חדש ולא כאן</p>'+
        '<button class=&quot;backlink&quot; type=&quot;button&quot; id=&quot;back&quot;>חזרה לדוח האחרון</button>'+
      '</section>';
    document.getElementById('back').addEventListener('click', function(){ select(current); });
  }

  function spark(){
    return '<svg viewBox=&quot;0 0 320 130&quot; preserveAspectRatio=&quot;none&quot;>'+
      '<defs><linearGradient id=&quot;sg&quot; x1=&quot;0&quot; y1=&quot;0&quot; x2=&quot;0&quot; y2=&quot;1&quot;>'+
      '<stop offset=&quot;0&quot; style=&quot;stop-color:var(--bd);stop-opacity:.22&quot;/>'+
      '<stop offset=&quot;1&quot; style=&quot;stop-color:var(--bd);stop-opacity:0&quot;/>'+
      '</linearGradient></defs>'+
      '<path d=&quot;M0 96 40 82 80 90 120 62 160 70 200 42 240 54 280 30 320 38 320 130 0 130Z&quot; style=&quot;fill:url(#sg)&quot;/>'+
      '<path d=&quot;M0 96 40 82 80 90 120 62 160 70 200 42 240 54 280 30 320 38&quot; fill=&quot;none&quot; style=&quot;stroke:var(--bd);opacity:.55&quot; stroke-width=&quot;2.5&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/>'+
      '</svg>';
  }

  /* ---------- sheet control ---------- */
  var lastFocus = null;
  function openSheet(){
    if(sheetOpen) return;
    sheetOpen = true; lastFocus = document.activeElement;
    scrim.hidden = false; sheet.hidden = false;
    document.body.classList.add('locked');
    /* force reflow so transitions play */
    void sheet.offsetWidth;
    scrim.classList.add('open'); sheet.classList.add('open');
    setTimeout(function(){ closeBtn.focus(); }, 60);
  }
  function closeSheet(){
    if(!sheetOpen) return;
    sheetOpen = false;
    scrim.classList.remove('open'); sheet.classList.remove('open');
    document.body.classList.remove('locked');
    setTimeout(function(){ scrim.hidden = true; sheet.hidden = true; }, 340);
    if(lastFocus &amp;&amp; lastFocus.focus){ try{ lastFocus.focus(); }catch(e){} }
    else { moreTab.focus(); }
  }

  closeBtn.addEventListener('click', closeSheet);
  scrim.addEventListener('click', closeSheet);
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' &amp;&amp; sheetOpen){ e.preventDefault(); closeSheet(); }
    if(e.key === 'Tab' &amp;&amp; sheetOpen){
      var f = sheet.querySelectorAll('button');
      if(!f.length) return;
      var first = f[0], last = f[f.length-1];
      if(e.shiftKey &amp;&amp; document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey &amp;&amp; document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
  });

  /* init */
  select('senifim');
})();
</script>
