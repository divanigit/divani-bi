  :root{

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

      kpis:[{v:'+18%',l:'לעומת יוני'},{v:'3',l:'התראות'},{v:'נתניה',l:'סניף מוביל'}],
      rt:'תובנות מרכזיות', rows:[['נתניה עברה את היעד',112],['סגירה בפנייה אחת עלתה',94],['מקדמות פתוחות מצטברות',61]], unit:'idx'
    }
  };

  // ---- state ----
  var state = { groupId:'sales', reportId:'agents' };

  // ---- element refs ----
  var el = {
    seg: document.getElementById('segMount'),
    kickerText: document.getElementById('kickerText'),
    content: document.getElementById('content'),
    drawer: document.getElementById('drawer'),
    scrim: document.getElementById('scrim'),
    body: document.getElementById('drawerBody'),
    toast: document.getElementById('toast')
  };

  function groupOf(gid){ for(var i=0;i<GROUPS.length;i++){ if(GROUPS[i].id===gid) return GROUPS[i]; } return GROUPS[0]; }
  function reportName(rid){
    for(var i=0;i<GROUPS.length;i++){ for(var j=0;j<GROUPS[i].reports.length;j++){ if(GROUPS[i].reports[j].id===rid) return GROUPS[i].reports[j].name; } }
    return rid;
  }

  // ---- render the inline sibling segment (the key feature) ----
  function renderSeg(){
    var g = groupOf(state.groupId);
    el.kickerText.innerHTML = g.name + ' <em>· ' + g.desc + '</em>';
    var sibs = g.reports;

    if(sibs.length <= 1){
      // single-item group: no segment, show the group/report name only
      el.seg.innerHTML = '<div class=&quot;seg-solo&quot;>'+ sibs[0].name +
        (sibs[0].external?' <span class=&quot;up&quot;>↗</span>':'') + '</div>';
      return;
    }
    var html = '<div class=&quot;seg&quot; role=&quot;tablist&quot; aria-label=&quot;דוחות '+g.name+'&quot;>';
    for(var i=0;i<sibs.length;i++){
      var r = sibs[i], on = (r.id===state.reportId);
      html += '<button role=&quot;tab&quot; aria-selected=&quot;'+(on?'true':'false')+'&quot; '+
              'tabindex=&quot;'+(on?'0':'-1')+'&quot; data-rid=&quot;'+r.id+'&quot;>'+ r.name +'</button>';
    }
    html += '</div>';
    el.seg.innerHTML = html;

    var btns = el.seg.querySelectorAll('button[data-rid]');
    for(var k=0;k<btns.length;k++){
      btns[k].addEventListener('click', function(){ selectReport(this.getAttribute('data-rid')); });
      btns[k].addEventListener('keydown', segKey);

  function segKey(e){
    if(e.key!=='ArrowRight' &amp;&amp; e.key!=='ArrowLeft') return;

    var idx=0; for(var i=0;i<sibs.length;i++){ if(sibs[i].id===state.reportId) idx=i; }
    // RTL: ArrowLeft -> next, ArrowRight -> previous
    var next = e.key==='ArrowLeft' ? idx+1 : idx-1;
    if(next<0) next=sibs.length-1; if(next>=sibs.length) next=0;
    selectReport(sibs[next].id);
    var b = el.seg.querySelector('button[data-rid=&quot;'+sibs[next].id+'&quot;]'); if(b) b.focus();
  }

  // ---- render the content stub ----
  function renderContent(){
    var name = reportName(state.reportId);
    var d = DATA[state.reportId];
    var h = '';
    h += '<p class=&quot;now&quot;>מציג: <b>'+name+'</b></p>';
    h += '<h1 class=&quot;title&quot;>'+name+'</h1>';

      var max=0; for(var m=0;m<d.rows.length;m++){ if(d.rows[m][1]>max) max=d.rows[m][1]; }
      h += '<div class=&quot;card&quot;><h3>'+d.rt+'<span>יולי 2026</span></h3>';

                 : d.unit==='%' ? val+'%'
                 : val.toLocaleString('en-US');
        h += '<div class=&quot;row&quot;><span class=&quot;nm&quot;>'+d.rows[r][0]+'</span>'+
             '<span class=&quot;bar&quot;><i style=&quot;width:'+pct+'%&quot;></i></span>'+
             '<span class=&quot;vv&quot;>'+disp+'</span></div>';
      }
      h += '</div>';
    }
    // sibling flip hint
    var g = groupOf(state.groupId);
    if(g.reports.length>1){
      var others=[]; for(var s=0;s<g.reports.length;s++){ if(g.reports[s].id!==state.reportId) others.push(g.reports[s].name); }
      h += '<div class=&quot;flip-hint&quot;><svg viewBox=&quot;0 0 24 24&quot;><path d=&quot;M17 3l4 4-4 4M21 7H8M7 21l-4-4 4-4M3 17h13&quot;/></svg>'+
           '<span>מעבר מהיר ל'+others.join(' / ')+' בלחיצה על המתג למעלה — בלי לפתוח תפריט.</span></div>';
    }
    el.content.innerHTML = h;
  }

  // ---- switch the current report in place (segment tap) ----
  function selectReport(rid){
    // find its group
    for(var i=0;i<GROUPS.length;i++){ for(var j=0;j<GROUPS[i].reports.length;j++){
      if(GROUPS[i].reports[j].id===rid){ state.groupId=GROUPS[i].id; state.reportId=rid; }
    }}
    renderSeg(); renderContent(); syncDrawer();
  }

  // ---- drawer ----
  function buildDrawer(){
    var h='';
    for(var i=0;i<GROUPS.length;i++){
      var g=GROUPS[i];
      h += '<div class=&quot;grp&quot;><div class=&quot;grp-h&quot;>'+g.name+'</div>';
      for(var j=0;j<g.reports.length;j++){
        var r=g.reports[j];
        h += '<button class=&quot;item&quot; data-rid=&quot;'+r.id+'&quot; data-ext=&quot;'+(r.external?'1':'0')+'&quot;>'+
             '<span class=&quot;ic&quot;><svg viewBox=&quot;0 0 24 24&quot;>'+(IC[r.id]||'')+'</svg></span>'+
             '<span class=&quot;lab&quot;><b>'+r.name+'</b>'+(r.external?'<small>נפתח בדף חדש</small>':'')+'</span>'+
             (r.external?'<span class=&quot;up&quot;>↗</span>':'<span class=&quot;chk&quot; aria-hidden=&quot;true&quot;></span>')+
             '</button>';
      }
      h += '</div>';
    }
    el.body.innerHTML=h;
    var items=el.body.querySelectorAll('.item');
    for(var k=0;k<items.length;k++){
      items[k].addEventListener('click', function(){
        var rid=this.getAttribute('data-rid');
        if(this.getAttribute('data-ext')==='1'){
          showToast('ביצועי נציגים היה נפתח כעת בדף חדש ↗');
          return; // current report stays visible
        }
        selectReport(rid); closeDrawer();
      });
    }
    syncDrawer();
  }
  function syncDrawer(){
    var items=el.body.querySelectorAll('.item');
    for(var k=0;k<items.length;k++){
      var on = items[k].getAttribute('data-rid')===state.reportId;
      items[k].classList.toggle('active', on);
      var chk=items[k].querySelector('.chk');
      if(chk) chk.innerHTML = on ? '<svg viewBox=&quot;0 0 24 24&quot;><path d=&quot;M5 12l5 5L20 6&quot;/></svg>' : '';
    }
  }

  var lastFocus=null;
  function openDrawer(){
    lastFocus=document.activeElement;
    el.drawer.classList.add('open'); el.scrim.classList.add('open');
    el.drawer.setAttribute('aria-hidden','false');
    document.getElementById('closeBtn').focus();
  }
  function closeDrawer(){
    el.drawer.classList.remove('open'); el.scrim.classList.remove('open');
    el.drawer.setAttribute('aria-hidden','true');
    if(lastFocus &amp;&amp; lastFocus.focus) lastFocus.focus();
  }

  var tT;
  function showToast(msg){
    el.toast.textContent=msg; el.toast.classList.add('show');
    clearTimeout(tT); tT=setTimeout(function(){ el.toast.classList.remove('show'); },2600);
  }

  // ---- wire up ----
  document.getElementById('hamBtn').addEventListener('click', openDrawer);
  document.getElementById('closeBtn').addEventListener('click', closeDrawer);
  el.scrim.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' &amp;&amp; el.drawer.classList.contains('open')) closeDrawer(); });

  // ---- init ----
  buildDrawer(); renderSeg(); renderContent();
})();
</script>

<!-- Drawer -->

<aside class=&quot;drawer&quot; id=&quot;drawer&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-label=&quot;כל הדוחות&quot; aria-hidden=&quot;true&quot;>

<script>
/* ---------- icon set (inline SVG paths) ---------- */
const ICON = {
  agents:'<circle cx=&quot;12&quot; cy=&quot;8&quot; r=&quot;3.4&quot;/><path d=&quot;M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6&quot;/>',
  branches:'<path d=&quot;M4 20V9l8-5 8 5v11&quot;/><path d=&quot;M9 20v-6h6v6&quot;/>',
  sources:'<path d=&quot;M12 21C7 16.5 4 13.4 4 9.5A5 5 0 0 1 12 6a5 5 0 0 1 8 3.5c0 3.9-3 7-8 11.5Z&quot;/>',
  cash:'<rect x=&quot;3&quot; y=&quot;6&quot; width=&quot;18&quot; height=&quot;12&quot; rx=&quot;2&quot;/><circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;2.4&quot;/>',
  service:'<path d=&quot;M4 12a8 8 0 0 1 16 0v5a2 2 0 0 1-2 2h-2v-6h4&quot;/><path d=&quot;M4 13v4a2 2 0 0 0 2 2h2v-6H4&quot;/>',
  advance:'<path d=&quot;M12 3v18&quot;/><path d=&quot;M16.5 7.5C16.5 5.6 14.5 4.5 12 4.5S7.5 5.6 7.5 7.5 9.5 10.5 12 11s4.5 1.5 4.5 3.5S14.5 18 12 18 7.5 16.9 7.5 15&quot;/>',
  segment:'<path d=&quot;M12 3v9l7.5 4.5&quot;/><circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;9&quot;/>',
  insights:'<path d=&quot;M9 18h6M10 21h4&quot;/><path d=&quot;M12 3a6 6 0 0 0-3.5 10.9c.6.5.9 1.1 1 1.8h5c.1-.7.4-1.3 1-1.8A6 6 0 0 0 12 3Z&quot;/>',
  reps:'<path d=&quot;M4 19V5&quot;/><path d=&quot;M8 19v-7M12 19V8M16 19v-4M20 19V6&quot;/>',
  back:'<path d=&quot;M9 6l6 6-6 6&quot;/>',
  chev:'<path d=&quot;M14 6l-6 6 6 6&quot;/>',
  ext:'<path d=&quot;M7 17L17 7M9 7h8v8&quot;/>',
  info:'<circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;9&quot;/><path d=&quot;M12 11v5M12 8h.01&quot;/>'
};
const svg=(k,extra='')=>`<svg viewBox=&quot;0 0 24 24&quot; ${extra}>${ICON[k]}</svg>`;

/* ---------- report registry ---------- */
const REPORTS={
  agents:  {name:'סוכנים',       group:'מכירות', kind:'sales', ic:'agents'},
  branches:{name:'סניפים',       group:'מכירות', kind:'sales', ic:'branches'},
  sources: {name:'מקורות הגעה',  group:'תפעול',  ic:'sources'},
  cash:    {name:'מזומן',        group:'תפעול',  ic:'cash'},
  service: {name:'שירות',        group:'תפעול',  ic:'service'},
  advance: {name:'מקדמות',       group:'תפעול',  ic:'advance'},
  segment: {name:'פילוח',        group:'ניתוח',  ic:'segment'},
  insights:{name:'תובנות',       group:'ניתוח',  ic:'insights'},
  reps:    {name:'ביצועי נציגים',group:'דוח נפרד', ic:'reps', external:true, desc:'נפתח בעמוד חדש'}
};
const DRAWER_GROUPS=[
  {label:'תפעול', items:['sources','cash','service','advance'], subs:{sources:'מאיפה הגיעו הלקוחות',cash:'תקבולי מזומן בתקופה',service:'פניות ושירות לקוחות',advance:'מקדמות שנגבו'}},
  {label:'ניתוח', items:['segment','insights'], subs:{segment:'פילוח לקוחות ומוצרים',insights:'תובנות אוטומטיות'}},
  {label:'דוח נפרד', items:['reps'], subs:{reps:'נפתח בעמוד חדש ↗'}}
];

/* ---------- demo content per report (stub) ---------- */
const DEMO={
  agents:{sub:'מכירות לפי סוכן · אותה תקופה', kpi:[['סך מכירות','1.42M ₪','+8%','up'],['עסקאות','214','+5%','up'],['ממוצע לעסקה','6,640 ₪','−1%','dn']],
    chart:'פירוק לפי סוכן', bars:[['רונן',92],['מיכל',80],['אבי',67],['דנה',58],['יוסי',44]]},
  branches:{sub:'מכירות לפי סניף · אותה תקופה', kpi:[['סך מכירות','1.42M ₪','+8%','up'],['סניף מוביל','נתניה','','flat'],['ממוצע לסניף','284K ₪','+6%','up']],
    chart:'פירוק לפי סניף', bars:[['נתניה',88],['ראשון',72],['חיפה',63],['ירושלים',49],['בית שמש',31]]},
  sources:{sub:'מאיפה הגיעו הלקוחות בתקופה', kpi:[['פניות','1,204','+12%','up'],['המרה','18%','+2%','up'],['מקור מוביל','גוגל','','flat']],
    chart:'פניות לפי מקור', bars:[['גוגל',95],['פייסבוק',70],['המלצה',52],['אתר',40],['מעבר ברחוב',22]]},
  cash:{sub:'תקבולי מזומן בתקופה', kpi:[['סך מזומן','312K ₪','−4%','dn'],['תקבולים','486','+1%','up'],['ממוצע','642 ₪','−5%','dn']],
    chart:'מזומן לפי שבוע', bars:[['שבוע 1',64],['שבוע 2',81],['שבוע 3',73],['שבוע 4',58]]},
  service:{sub:'פניות שירות ומצב טיפול', kpi:[['פניות פתוחות','37','−9%','up'],['בטיפול','54','','flat'],['זמן תגובה','2.4 שעות','−12%','up']],
    chart:'פניות לפי סטטוס', bars:[['נסגרו',86],['בטיפול',54],['פתוחות',37],['ממתינות',19]]},
  advance:{sub:'מקדמות שנגבו בתקופה', kpi:[['סך מקדמות','208K ₪','+7%','up'],['הזמנות','142','+4%','up'],['ממוצע','1,465 ₪','+3%','up']],
    chart:'מקדמות לפי סניף', bars:[['נתניה',77],['ראשון',66],['חיפה',54],['ירושלים',41],['בית שמש',28]]},
  segment:{sub:'פילוח לקוחות ומוצרים', kpi:[['לקוחות','1,860','+6%','up'],['חדשים','642','+11%','up'],['חוזרים','1,218','+3%','up']],
    chart:'לקוחות לפי סוג', bars:[['חדשים',60],['חוזרים',88],['רדומים',34],['VIP',22]]},
  insights:{sub:'תובנות אוטומטיות מהתקופה', kpi:[['תובנות','9','','flat'],['הזדמנויות','4','','flat'],['התראות','2','','flat']],
    chart:'עוצמת תובנה לפי תחום', bars:[['מכירות',80],['שירות',55],['מלאי',48],['תמחור',36]]}
};

/* ---------- state ---------- */
let current='agents';
let lastSales='agents';

/* ---------- rendering ---------- */
function contentHTML(id){
  const r=REPORTS[id];
  if(r.external){
    return `
      <div class=&quot;showing other&quot;><span class=&quot;pip&quot;></span>מציג: <b>${r.name} ↗</b></div>
      <div class=&quot;note&quot;>
        ${svg('ext')}
        <div><div class=&quot;nt&quot;>${r.name} — דוח נפרד</div>
        <div class=&quot;nb&quot;>במערכת האמיתית הדוח הזה נפתח ב<b>עמוד חדש</b> נפרד ואינו מתחלף בתוך המסך הזה. הטוגל של מכירות נשאר במקומו כשחוזרים.</div></div>
      </div>`;
  }
  const d=DEMO[id]; const isSales=r.kind==='sales';
  const kpis=d.kpi.map(k=>{
    const cls=k[3]||'flat';
    const arrow= cls==='up'?'▲': cls==='dn'?'▼':'•';
    const dl=k[2]?`<span class=&quot;d ${cls}&quot;>${arrow} <span class=&quot;num&quot;>${k[2]}</span></span>`:'';
    return `<div class=&quot;kpi&quot;><div class=&quot;l&quot;>${k[0]}</div><div class=&quot;v&quot;><span class=&quot;num&quot;>${k[1]}</span></div>${dl}</div>`;
  }).join('');
  const max=Math.max(...d.bars.map(b=>b[1]));
  const bars=d.bars.map(b=>{
    const pct=Math.round(b[1]/max*100);
    return `<div class=&quot;bar&quot;><span class=&quot;bl&quot;>${b[0]}</span><span class=&quot;bt&quot;><span class=&quot;bf&quot; data-w=&quot;${pct}&quot;></span></span><span class=&quot;bv num&quot;>${b[1]}</span></div>`;
  }).join('');
  return `
    <div class=&quot;showing ${isSales?'':'other'}&quot;><span class=&quot;pip&quot;></span>מציג: <b>${r.name}</b></div>
    <div class=&quot;rpt-head&quot;>
      <h1 class=&quot;rpt-title&quot;>${r.name}</h1>
      <span class=&quot;rpt-group&quot;>${r.group}</span>
    </div>
    <p class=&quot;rpt-sub&quot;>${d.sub}</p>
    <div class=&quot;kpis&quot;>${kpis}</div>
    <div class=&quot;card&quot;><h3>${d.chart}</h3>${bars}</div>`;
}

function render(){
  const r=REPORTS[current];
  const isSales=r.kind==='sales';
  // content
  const main=document.getElementById('content');
  main.innerHTML=contentHTML(current);
  // final width is set instantly (no layout animation); the reveal runs on transform:scaleX
  main.querySelectorAll('.bf').forEach(f=>{ f.style.width=f.dataset.w+'%'; });
  requestAnimationFrame(()=>main.querySelectorAll('.bf').forEach(f=>{ f.style.transform='scaleX(1)'; }));

  // pinned toggle state
  const seg=document.getElementById('seg');
  seg.classList.toggle('muted', !isSales);
  document.getElementById('tab-agents').setAttribute('aria-selected', String(current==='agents'));
  document.getElementById('tab-branches').setAttribute('aria-selected', String(current==='branches'));

  // context banner (only for &quot;other&quot; reports)
  const ctx=document.getElementById('ctxbar');
  if(isSales){ ctx.classList.remove('show'); }
  else{
    ctx.classList.add('show');
    document.getElementById('ctxName').textContent = r.name + (r.external?' ↗':'');
    document.getElementById('ctxIcon').innerHTML = svg(r.ic);
  }

  // burger badge = &quot;you are off the sales pair&quot;
  document.getElementById('burger').classList.toggle('on', !isSales);

  // drawer active marks
  document.querySelectorAll('.ditem').forEach(el=>{
    el.setAttribute('aria-current', String(el.dataset.id===current));
  });
}

/* ---------- actions ---------- */
function pickSales(id){
  current=id; lastSales=id; render();
}
function backToSales(){
  current=lastSales; render();
}
function pickReport(id){
  const r=REPORTS[id];
  if(r.external){
    toast('דוח '+r.name+' היה נפתח בעמוד חדש');
    closeDrawer();
    return;
  }
  current=id; render(); closeDrawer();
}

/* ---------- drawer ---------- */
let lastFocus=null;
function openDrawer(){
  lastFocus=document.activeElement;
  document.getElementById('scrim').classList.add('open');
  const d=document.getElementById('drawer'); d.classList.add('open'); d.setAttribute('aria-hidden','false');
  document.getElementById('burger').setAttribute('aria-expanded','true');
  document.body.style.overflow='hidden';
  const x=d.querySelector('.xclose'); if(x) x.focus();
}
function closeDrawer(){
  document.getElementById('scrim').classList.remove('open');
  const d=document.getElementById('drawer'); d.classList.remove('open'); d.setAttribute('aria-hidden','true');
  document.getElementById('burger').setAttribute('aria-expanded','false');
  document.body.style.overflow='';
  if(lastFocus&amp;&amp;lastFocus.focus) lastFocus.focus();
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });

/* ---------- toast ---------- */
let toastT=null;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600);
}

/* ---------- build drawer ---------- */
(function buildDrawer(){
  const body=document.getElementById('dbody');
  let html=`<div class=&quot;pinnote&quot;>${svg('info')}<div><b>סוכנים · סניפים</b> מוצמדים בראש המסך — מעבר ביניהם בלי לפתוח את התפריט.</div></div>`;
  DRAWER_GROUPS.forEach(g=>{
    html+=`<div class=&quot;ggroup&quot;><div class=&quot;glabel&quot;>${g.label}</div>`;
    g.items.forEach(id=>{
      const r=REPORTS[id]; const ext=r.external;
      html+=`<button class=&quot;ditem ${ext?'ext':''}&quot; data-id=&quot;${id}&quot; onclick=&quot;pickReport('${id}')&quot; ${ext?'aria-label=&quot;'+r.name+' — נפתח בעמוד חדש&quot;':''}>
        <span class=&quot;di&quot;>${svg(r.ic)}</span>
        <span class=&quot;dt&quot;><span class=&quot;nm&quot;>${r.name}${ext?' ↗':''}</span><span class=&quot;ds&quot;>${g.subs[id]||''}</span></span>
        <span class=&quot;chev&quot;>${ext?svg('ext'):svg('chev')}</span>
      </button>`;
    });
    html+=`</div>`;
  });
  body.innerHTML=html;
})();

render();
</script>

.tile .tk{font-size:11px;color:var(--tx3);margin-top:6px;font-weight:700;line-height:1.25;}
.stubnote{margin-top:14px;font-size:11.5px;color:var(--tx3);font-weight:600;display:flex;align-items:center;gap:6px;}
.stubnote span{width:6px;height:6px;border-radius:999px;background:var(--line2);}

/* ---------- more sheet ---------- */
.backdrop{position:fixed;inset:0;z-index:39;background:rgba(8,20,15,.5);opacity:0;visibility:hidden;
  transition:opacity .26s ease,visibility .26s ease;}
.backdrop.open{opacity:1;visibility:visible;}
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;
  visibility:hidden;pointer-events:none;padding-bottom:env(safe-area-inset-bottom);}
.sheet.open{visibility:visible;}
.sheet-panel{width:100%;max-width:480px;background:var(--bg);border-top-left-radius:22px;border-top-right-radius:22px;
  border:1px solid var(--line);border-bottom:0;box-shadow:var(--sheet-shadow);pointer-events:auto;
  transform:translateY(102%);transition:transform .3s cubic-bezier(.22,1,.36,1);
  padding:8px 16px calc(20px + env(safe-area-inset-bottom));}
.sheet.open .sheet-panel{transform:translateY(0);}
.handle{width:40px;height:5px;border-radius:999px;background:var(--line2);margin:6px auto 10px;}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.shead h2{margin:0;font-size:16px;font-weight:800;color:var(--tx);}
.xbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  display:flex;align-items:center;justify-content:center;cursor:pointer;}
.xbtn svg{width:18px;height:18px;stroke:var(--tx2);}
.srow{display:flex;align-items:center;gap:13px;width:100%;min-height:60px;padding:10px 12px;margin-top:8px;
  background:var(--surface);border:1px solid var(--line);border-radius:15px;cursor:pointer;text-align:right;}
.srow:active{background:var(--line);}
.sicon{width:42px;height:42px;border-radius:11px;background:var(--bg);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.sicon svg{width:21px;height:21px;stroke:var(--bd);}
.stext{flex:1;min-width:0;}
.sname{font-size:15px;font-weight:800;color:var(--tx);display:flex;align-items:center;gap:6px;}
.ext{color:var(--bd);font-weight:800;font-size:14px;}
.ssub{font-size:12px;color:var(--tx3);font-weight:600;margin-top:2px;}
.chev{width:19px;height:19px;stroke:var(--tx3);flex:0 0 auto;}
.srow.disabled{opacity:.55;cursor:default;}
.srow.disabled .sicon svg{stroke:var(--tx3);}

/* toast */
.toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(24px + env(safe-area-inset-bottom));
  z-index:60;max-width:340px;width:calc(100% - 40px);background:var(--tx);color:var(--bg);
  padding:13px 16px;border-radius:14px;font-size:13.5px;font-weight:700;line-height:1.4;
  box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;visibility:hidden;transition:opacity .25s ease,transform .25s ease;
  display:flex;align-items:center;gap:9px;}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0);}
.toast svg{width:18px;height:18px;stroke:var(--bd);flex:0 0 auto;}

:focus-visible{outline:2px solid var(--bd);outline-offset:2px;border-radius:8px;}
@media (prefers-reduced-motion:reduce){*{transition:none !important;}}

<body>

      <div class=&quot;handle&quot;></div>

        <h2>עוד</h2>
        <button class=&quot;xbtn&quot; id=&quot;closeSheet&quot; aria-label=&quot;סגירה&quot;>
          <svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke-width=&quot;2.2&quot; stroke-linecap=&quot;round&quot;><path d=&quot;M6 6l12 12M18 6L6 18&quot;/></svg>
        </button>
      </div>
      <button class=&quot;srow&quot; id=&quot;repsRow&quot;>
        <div class=&quot;sicon&quot;>
          <svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;><path d=&quot;M4 20V10M10 20V4M16 20v-8M22 20H2&quot;/></svg>
        </div>
        <div class=&quot;stext&quot;>
          <div class=&quot;sname&quot;>ביצועי נציגים <span class=&quot;ext&quot;>↗</span></div>
          <div class=&quot;ssub&quot;>דוח מלא — נפתח בדף נפרד</div>
        </div>
        <svg class=&quot;chev&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;><path d=&quot;M15 6l-6 6 6 6&quot;/></svg>
      </button>
      <button class=&quot;srow disabled&quot; disabled aria-disabled=&quot;true&quot;>
        <div class=&quot;sicon&quot;>
          <svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;><path d=&quot;M12 5v14M5 12h14&quot;/></svg>
        </div>
        <div class=&quot;stext&quot;>
          <div class=&quot;sname&quot;>דוחות נוספים</div>
          <div class=&quot;ssub&quot;>בקרוב</div>
        </div>
      </button>
    </div>
  </div>

  <div class=&quot;toast&quot; id=&quot;toast&quot;>
    <svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;><path d=&quot;M7 17L17 7M17 7H9M17 7v8&quot;/></svg>
    <span id=&quot;toastMsg&quot;></span>
  </div>

</div>

<script>
(function(){
  var REPORTS = {
    agents:{cat:&quot;sales&quot;,label:&quot;סוכנים&quot;,crumb:&quot;מכירות › חתך לפי סוכן&quot;,
      desc:&quot;סך המכירות בתקופה, מפולח לפי איש מכירות. אותם נתונים בדיוק כמו בדוח הסניפים — רק זווית החיתוך משתנה.&quot;,
      tiles:[[&quot;מכירות&quot;,&quot;₪1.24M&quot;],[&quot;הזמנות&quot;,&quot;312&quot;],[&quot;ממוצע לעסקה&quot;,&quot;₪3,970&quot;]]},
    branches:{cat:&quot;sales&quot;,label:&quot;סניפים&quot;,crumb:&quot;מכירות › חתך לפי סניף&quot;,
      desc:&quot;אותה תקופה, אותן מכירות — הפעם מפולח לפי סניף. ההשוואה סוכנים↔סניפים היא לחיצה אחת, במקום.&quot;,
      tiles:[[&quot;מכירות&quot;,&quot;₪1.24M&quot;],[&quot;סניף מוביל&quot;,&quot;נתניה&quot;],[&quot;סניפים פעילים&quot;,&quot;6&quot;]]},
    sources:{cat:&quot;ops&quot;,label:&quot;מקורות הגעה&quot;,crumb:&quot;תפעול › מקורות הגעה&quot;,
      desc:&quot;מאיפה הגיעו הלקוחות בתקופה — פילוח לפי ערוץ פנייה ושיעור ההמרה בכל ערוץ.&quot;,
      tiles:[[&quot;פניות&quot;,&quot;1,840&quot;],[&quot;מקור מוביל&quot;,&quot;אתר&quot;],[&quot;המרה&quot;,&quot;17%&quot;]]},
    cash:{cat:&quot;ops&quot;,label:&quot;מזומן&quot;,crumb:&quot;תפעול › מזומן&quot;,
      desc:&quot;תקבולי המזומן בתקופה, מספר העסקאות ומשקלם מתוך המחזור הכולל.&quot;,
      tiles:[[&quot;תקבולי מזומן&quot;,&quot;₪286K&quot;],[&quot;עסקאות&quot;,&quot;74&quot;],[&quot;מהמחזור&quot;,&quot;9%&quot;]]},
    service:{cat:&quot;ops&quot;,label:&quot;שירות&quot;,crumb:&quot;תפעול › שירות&quot;,
      desc:&quot;פניות השירות בתקופה, מהירות המענה ושיעור הסגירה בפנייה אחת.&quot;,
      tiles:[[&quot;פניות שירות&quot;,&quot;512&quot;],[&quot;זמן מענה&quot;,&quot;4 ש׳&quot;],[&quot;נסגר בפנייה&quot;,&quot;63%&quot;]]},
    advances:{cat:&quot;ops&quot;,label:&quot;מקדמות&quot;,crumb:&quot;תפעול › מקדמות&quot;,
      desc:&quot;מקדמות פתוחות שטרם הושלמו לעסקה — סכום כולל וכמות הממתינות להשלמה.&quot;,
      tiles:[[&quot;מקדמות פתוחות&quot;,&quot;128&quot;],[&quot;סכום&quot;,&quot;₪410K&quot;],[&quot;ממתין להשלמה&quot;,&quot;22&quot;]]},
    segmentation:{cat:&quot;analysis&quot;,label:&quot;פילוח&quot;,crumb:&quot;ניתוח › פילוח&quot;,
      desc:&quot;פילוח בסיס הלקוחות לפלחים לפי התנהגות רכישה, כדי לזהות היכן מרוכז הערך.&quot;,
      tiles:[[&quot;לקוחות&quot;,&quot;4,562&quot;],[&quot;פלחים&quot;,&quot;5&quot;],[&quot;פלח מוביל&quot;,&quot;משפחות&quot;]]},
    insights:{cat:&quot;analysis&quot;,label:&quot;תובנות&quot;,crumb:&quot;ניתוח › תובנות&quot;,
      desc:&quot;תובנות אוטומטיות שהמערכת מזהה מהנתונים — מגמות, חריגות והזדמנויות לפעולה.&quot;,
      tiles:[[&quot;תובנות פעילות&quot;,&quot;9&quot;],[&quot;חדשות השבוע&quot;,&quot;3&quot;],[&quot;בעדיפות&quot;,&quot;2&quot;]]}
  };

  var CATS = {
    sales:{label:&quot;מכירות&quot;,views:[&quot;agents&quot;,&quot;branches&quot;]},
    ops:{label:&quot;תפעול&quot;,views:[&quot;sources&quot;,&quot;cash&quot;,&quot;service&quot;,&quot;advances&quot;]},
    analysis:{label:&quot;ניתוח&quot;,views:[&quot;segmentation&quot;,&quot;insights&quot;]}
  };

  var state = {cat:&quot;sales&quot;, view:&quot;agents&quot;, last:{sales:&quot;agents&quot;, ops:&quot;sources&quot;, analysis:&quot;segmentation&quot;}};

  var seg = document.getElementById(&quot;seg&quot;);
  var now = document.getElementById(&quot;now&quot;);
  var seghint = document.getElementById(&quot;seghint&quot;);
  var catBtns = Array.prototype.slice.call(document.querySelectorAll(&quot;.cat&quot;));
  var sheet = document.getElementById(&quot;sheet&quot;);
  var backdrop = document.getElementById(&quot;backdrop&quot;);

  function renderCats(moreOpen){
    catBtns.forEach(function(b){
      var c = b.getAttribute(&quot;data-cat&quot;);
      var on = moreOpen ? (c===&quot;more&quot;) : (c===state.cat &amp;&amp; c!==&quot;more&quot;);
      b.setAttribute(&quot;aria-selected&quot;, on ? &quot;true&quot;:&quot;false&quot;);
    });
  }

  function renderSeg(){
    var views = CATS[state.cat].views;
    seghint.textContent = views.length>2
      ? &quot;בחרו חתך — מעבר מיידי בלחיצה אחת&quot;
      : &quot;החלפה בין החתכים — לחיצה אחת, במקום&quot;;
    seg.style.gridTemplateColumns = &quot;repeat(2,1fr)&quot;;
    seg.innerHTML = &quot;&quot;;
    views.forEach(function(v){
      var r = REPORTS[v];
      var btn = document.createElement(&quot;button&quot;);
      btn.type = &quot;button&quot;;
      btn.textContent = r.label;
      btn.setAttribute(&quot;aria-pressed&quot;, v===state.view ? &quot;true&quot;:&quot;false&quot;);
      btn.addEventListener(&quot;click&quot;, function(){ selectView(v); });
      seg.appendChild(btn);
    });
  }

  function buildContent(r){
    var tiles = r.tiles.map(function(t){
      return '<div class=&quot;tile&quot;><div class=&quot;tv&quot;><bdi>'+t[1]+'</bdi></div><div class=&quot;tk&quot;>'+t[0]+'</div></div>';
    }).join(&quot;&quot;);
    return '<div class=&quot;crumb&quot;>'+r.crumb+'</div>'+
      '<div class=&quot;showing&quot;>מציג:</div>'+
      '<h1 class=&quot;rtitle&quot;>'+r.label+'</h1>'+
      '<p class=&quot;rdesc&quot;>'+r.desc+'</p>'+
      '<div class=&quot;tiles&quot;>'+tiles+'</div>'+
      '<div class=&quot;stubnote&quot;><span></span>נתוני דמה להדגמת הניווט</div>';
  }

  function renderContent(){
    var r = REPORTS[state.view];
    now.classList.add(&quot;swap&quot;);
    setTimeout(function(){
      now.innerHTML = buildContent(r);
      now.classList.remove(&quot;swap&quot;);
    },130);
  }

  function selectView(v){
    state.view = v;
    state.cat = REPORTS[v].cat;
    state.last[state.cat] = v;
    renderCats(false);
    renderSeg();
    renderContent();
  }

  function selectCategory(cat){
    if(cat===&quot;more&quot;){ openSheet(); return; }
    state.cat = cat;
    state.view = state.last[cat];
    renderCats(false);
    renderSeg();
    renderContent();
  }

  catBtns.forEach(function(b){
    b.addEventListener(&quot;click&quot;, function(){ selectCategory(b.getAttribute(&quot;data-cat&quot;)); });
  });

  /* ---- sheet ---- */
  function openSheet(){
    renderCats(true);
    backdrop.classList.add(&quot;open&quot;);
    sheet.classList.add(&quot;open&quot;);
    document.getElementById(&quot;closeSheet&quot;).focus();
  }
  function closeSheet(){
    backdrop.classList.remove(&quot;open&quot;);
    sheet.classList.remove(&quot;open&quot;);
    renderCats(false);
  }
  document.getElementById(&quot;closeSheet&quot;).addEventListener(&quot;click&quot;, closeSheet);
  backdrop.addEventListener(&quot;click&quot;, closeSheet);
  sheet.addEventListener(&quot;click&quot;, function(e){ if(e.target===sheet) closeSheet(); });
  document.addEventListener(&quot;keydown&quot;, function(e){ if(e.key===&quot;Escape&quot; &amp;&amp; sheet.classList.contains(&quot;open&quot;)) closeSheet(); });

  document.getElementById(&quot;repsRow&quot;).addEventListener(&quot;click&quot;, function(){
    closeSheet();
    showToast(&quot;היה נפתח דף נפרד: ביצועי נציגים ↗&quot;);
  });

  /* ---- toast ---- */
  var toast = document.getElementById(&quot;toast&quot;);
  var toastMsg = document.getElementById(&quot;toastMsg&quot;);
  var toastT;
  function showToast(msg){
    toastMsg.textContent = msg;
    toast.classList.add(&quot;show&quot;);
    clearTimeout(toastT);
    toastT = setTimeout(function(){ toast.classList.remove(&quot;show&quot;); }, 2600);
  }
  document.getElementById(&quot;periodBtn&quot;).addEventListener(&quot;click&quot;, function(){
    showToast(&quot;בורר תקופה — הדגמה בלבד&quot;);
  });

  /* init */
  renderCats(false);
  renderSeg();
  now.innerHTML = buildContent(REPORTS[state.view]);
})();
</script>
